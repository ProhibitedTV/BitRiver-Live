global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: bitriver-live
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/metrics.token
    static_configs:
      - targets:
          - bitriver-live:8080

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
