global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: bitriver-api
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/metrics.token
    static_configs:
      - targets:
          - bitriver-live:8080

  - job_name: bitriver-transcoder
    metrics_path: /metrics
    static_configs:
      - targets:
          - transcoder:9000

  - job_name: bitriver-srs-controller
    metrics_path: /metrics
    static_configs:
      - targets:
          - srs-controller:1985

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
