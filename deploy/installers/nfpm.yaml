name: bitriver-live
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
section: misc
priority: optional
maintainer: BitRiver Live Team <dev@bitriver.live>
description: BitRiver Live launcher and CLI
homepage: https://github.com/ProhibitedTV/BitRiver-Live
license: MIT
contents:
  - src: "${LAUNCHER_ROOT}/bin/bitriver"
    dst: /usr/local/bin/bitriver
    expand: true
    file_info:
      mode: 0755
  - src: "${LAUNCHER_ROOT}/bin/bitriver-live"
    dst: /usr/local/bin/bitriver-live
    expand: true
    file_info:
      mode: 0755
  - src: "${LAUNCHER_ROOT}/share/bitriver-live/"
    dst: /usr/local/share/bitriver-live
    expand: true
  - src: "${LAUNCHER_ROOT}/share/bitriver-live/deploy/install/compose-host.sh"
    dst: /usr/local/sbin/bitriver-host
    expand: true
    file_info:
      mode: 0755
  - src: "${LAUNCHER_ROOT}/share/bitriver-live/deploy/installers/bitriver-live.desktop"
    dst: /usr/share/applications/bitriver-live.desktop
    expand: true
    file_info:
      mode: 0644
rpm:
  summary: BitRiver Live launcher and CLI
  compression: gzip
deb:
  compression: gzip
