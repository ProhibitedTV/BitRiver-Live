# Optional ulimits overlay for ingest components.
#
# This file intentionally avoids `deploy.resources` because those limits are
# Swarm-only semantics and are not reliably enforced by `docker compose` in
# non-Swarm mode.
#
# For enforceable CPU/memory limits under Docker Compose, layer
# `deploy/docker-compose.limits.yml` as well:
#   docker compose -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.limits.yml \
#     -f deploy/docker-compose.resources.yml up -d
services:
  srs:
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  ome:
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  transcoder:
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
