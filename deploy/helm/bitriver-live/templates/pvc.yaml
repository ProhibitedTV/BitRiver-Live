{{- if .Values.persistence.api.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bitriver-live.fullname" . }}-api-data
  labels:
    {{- include "bitriver-live.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.api.size }}
  {{- if .Values.persistence.api.storageClass }}
  storageClassName: {{ .Values.persistence.api.storageClass }}
  {{- end }}
---
{{- end }}
