apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bitriver-live.fullname" . }}-transcoder
  labels:
    {{- include "bitriver-live.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bitriver-live.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: transcoder
  template:
    metadata:
      labels:
        {{- include "bitriver-live.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: transcoder
    spec:
      containers:
        - name: transcoder
          image: {{ .Values.images.transcoder }}:{{ .Values.tags.transcoder }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: JOB_CONTROLLER_BIND
              value: :9000
            - name: JOB_CONTROLLER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bitriver-live.fullname" . }}-secrets
                  key: BITRIVER_TRANSCODER_TOKEN
            - name: BITRIVER_TRANSCODER_PUBLIC_BASE_URL
              value: {{ .Values.env.BITRIVER_TRANSCODER_PUBLIC_BASE_URL | quote }}
            - name: BITRIVER_TRANSCODER_PUBLIC_DIR
              value: {{ .Values.env.BITRIVER_TRANSCODER_PUBLIC_DIR | quote }}
            - name: BITRIVER_TRANSCODER_RETENTION_LIVE
              value: {{ .Values.env.BITRIVER_TRANSCODER_RETENTION_LIVE | quote }}
            - name: BITRIVER_TRANSCODER_RETENTION_UPLOADS
              value: {{ .Values.env.BITRIVER_TRANSCODER_RETENTION_UPLOADS | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: transcoder-data
              mountPath: /work
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: transcoder-data
          {{- if .Values.persistence.transcoder.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "bitriver-live.fullname" . }}-transcoder-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bitriver-live.fullname" . }}-transcoder
  labels:
    {{- include "bitriver-live.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.transcoder.type }}
  ports:
    - name: http
      port: {{ .Values.service.transcoder.port }}
      targetPort: http
  selector:
    {{- include "bitriver-live.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: transcoder
