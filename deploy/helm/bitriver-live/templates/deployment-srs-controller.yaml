apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bitriver-live.fullname" . }}-srs-controller
  labels:
    {{- include "bitriver-live.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bitriver-live.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: srs-controller
  template:
    metadata:
      labels:
        {{- include "bitriver-live.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: srs-controller
    spec:
      containers:
        - name: srs-controller
          image: {{ .Values.images.srsController }}:{{ .Values.tags.srsController }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 1985
          env:
            - name: BITRIVER_SRS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bitriver-live.fullname" . }}-secrets
                  key: BITRIVER_SRS_TOKEN
            - name: SRS_CONTROLLER_BIND
              value: :1985
            - name: SRS_CONTROLLER_UPSTREAM
              value: {{ .Values.env.SRS_CONTROLLER_UPSTREAM | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bitriver-live.fullname" . }}-srs-controller
  labels:
    {{- include "bitriver-live.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.srsController.type }}
  ports:
    - name: http
      port: {{ .Values.service.srsController.port }}
      targetPort: http
  selector:
    {{- include "bitriver-live.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: srs-controller
