apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bitriver-live.fullname" . }}-ome
  labels:
    {{- include "bitriver-live.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bitriver-live.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ome
  template:
    metadata:
      labels:
        {{- include "bitriver-live.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ome
    spec:
      containers:
        - name: ome
          image: {{ .Values.images.ome }}:{{ .Values.tags.ome }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: BITRIVER_OME_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "bitriver-live.fullname" . }}-secrets
                  key: BITRIVER_OME_USERNAME
            - name: BITRIVER_OME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bitriver-live.fullname" . }}-secrets
                  key: BITRIVER_OME_PASSWORD
            - name: BITRIVER_OME_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bitriver-live.fullname" . }}-secrets
                  key: BITRIVER_OME_ACCESS_TOKEN
            - name: BITRIVER_OME_HEALTHCHECK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bitriver-live.fullname" . }}-secrets
                  key: BITRIVER_OME_HEALTHCHECK_TOKEN
            - name: BITRIVER_OME_HEALTHCHECK_AUTH_MODE
              value: {{ .Values.env.BITRIVER_OME_HEALTHCHECK_AUTH_MODE | quote }}
            - name: BITRIVER_OME_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bitriver-live.fullname" . }}-secrets
                  key: BITRIVER_OME_API_TOKEN
          ports:
            - name: api
              containerPort: 8081
            - name: llhls
              containerPort: {{ .Values.ome.llhlsPort }}
            - name: llhls-tls
              containerPort: {{ .Values.ome.llhlsTlsPort }}
            - name: signalling
              containerPort: {{ .Values.service.ome.signallingPort }}
            - name: signalling-tls
              containerPort: {{ .Values.service.ome.tlsPort }}
            - name: relay-tcp
              containerPort: {{ .Values.service.ome.relayPort }}
              protocol: TCP
            - name: relay-udp
              containerPort: {{ .Values.service.ome.relayPort }}
              protocol: UDP
{{- range $index, $port := .Values.service.ome.icePorts }}
            - name: ice-udp-{{ $port }}
              containerPort: {{ $port }}
              protocol: UDP
{{- end }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  probe_source="bitriver-ome"
                  probe_config="deploy/helm/bitriver-live/templates/deployment-ome.yaml"
                  health_url="http://localhost:8081/v1/health"
                  auth_mode="$BITRIVER_OME_HEALTHCHECK_AUTH_MODE"

                  if [ -z "$auth_mode" ]; then
                    auth_mode="accesstoken"
                  fi

                  token="$BITRIVER_OME_HEALTHCHECK_TOKEN"
                  token_source="BITRIVER_OME_HEALTHCHECK_TOKEN"
                  if [ -z "$token" ]; then
                    token="$BITRIVER_OME_ACCESS_TOKEN"
                    token_source="BITRIVER_OME_ACCESS_TOKEN"
                  fi
                  if [ -z "$token" ]; then
                    token="$BITRIVER_OME_API_TOKEN"
                    token_source="BITRIVER_OME_API_TOKEN"
                  fi

                  probe_access_token() {
                    http_status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 4 -H "Authorization: Bearer $token" "$health_url")"
                    [ "$http_status" = "200" ]
                  }

                  probe_basic_auth() {
                    # Pass credentials as literal argv entries so shell metacharacters are not re-interpreted.
                    http_status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 4 -u "$BITRIVER_OME_USERNAME:$BITRIVER_OME_PASSWORD" "$health_url")"
                    [ "$http_status" = "200" ]
                  }

                  probe_unauthenticated() {
                    http_status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 4 "$health_url")"
                    [ "$http_status" = "200" ]
                  }

                  case "$auth_mode" in
                    accesstoken)
                      if [ -z "$token" ]; then
                        echo "[$probe_source] OME healthcheck misconfigured in $probe_config: BITRIVER_OME_HEALTHCHECK_TOKEN, BITRIVER_OME_ACCESS_TOKEN, and BITRIVER_OME_API_TOKEN are all empty inside the container" >&2
                        exit 1
                      fi

                      if printf '%s' "$token" | grep -Eq '^[[:space:]]*Bearer[[:space:]]+'; then
                        echo "[$probe_source] OME healthcheck auth mismatch in $probe_config: auth_mode=$auth_mode expects raw token values because probe adds Authorization: Bearer" >&2
                        exit 1
                      fi

                      echo "[$probe_source] OME healthcheck startup auth_mode=$auth_mode credential_type=access_token source=$token_source value=<redacted>"
                      ;;
                    basic)
                      if [ -z "${BITRIVER_OME_USERNAME:-}" ] || [ -z "${BITRIVER_OME_PASSWORD:-}" ]; then
                        echo "[$probe_source] OME healthcheck misconfigured in $probe_config: BITRIVER_OME_USERNAME and BITRIVER_OME_PASSWORD must both be set for basic auth mode" >&2
                        exit 1
                      fi

                      echo "[$probe_source] OME healthcheck startup auth_mode=$auth_mode credential_type=username_password username=<redacted> password=<redacted>"
                      ;;
                    none|disabled|off)
                      echo "[$probe_source] OME healthcheck startup auth_mode=$auth_mode credential_type=none"
                      ;;
                    *)
                      echo "[$probe_source] OME healthcheck misconfigured in $probe_config: unsupported BITRIVER_OME_HEALTHCHECK_AUTH_MODE=$auth_mode (expected accesstoken, basic, or none/off/disabled)" >&2
                      exit 1
                      ;;
                  esac

                  if { [ "$auth_mode" = "accesstoken" ] && probe_access_token; } || { [ "$auth_mode" = "basic" ] && probe_basic_auth; } || { [ "$auth_mode" = "none" ] && probe_unauthenticated; } || { [ "$auth_mode" = "off" ] && probe_unauthenticated; } || { [ "$auth_mode" = "disabled" ] && probe_unauthenticated; }; then
                    echo "[$probe_source] OME healthcheck succeeded with auth_mode=$auth_mode http_status=${http_status:-unknown}"
                    exit 0
                  fi

                  echo "[$probe_source] OME healthcheck failed for $health_url using auth_mode=$auth_mode from $probe_config" >&2
                  exit 1
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  probe_source="bitriver-ome"
                  probe_config="deploy/helm/bitriver-live/templates/deployment-ome.yaml"
                  health_url="http://localhost:8081/v1/health"
                  auth_mode="$BITRIVER_OME_HEALTHCHECK_AUTH_MODE"

                  if [ -z "$auth_mode" ]; then
                    auth_mode="accesstoken"
                  fi

                  token="$BITRIVER_OME_HEALTHCHECK_TOKEN"
                  token_source="BITRIVER_OME_HEALTHCHECK_TOKEN"
                  if [ -z "$token" ]; then
                    token="$BITRIVER_OME_ACCESS_TOKEN"
                    token_source="BITRIVER_OME_ACCESS_TOKEN"
                  fi
                  if [ -z "$token" ]; then
                    token="$BITRIVER_OME_API_TOKEN"
                    token_source="BITRIVER_OME_API_TOKEN"
                  fi

                  probe_access_token() {
                    http_status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 4 -H "Authorization: Bearer $token" "$health_url")"
                    [ "$http_status" = "200" ]
                  }

                  probe_basic_auth() {
                    # Pass credentials as literal argv entries so shell metacharacters are not re-interpreted.
                    http_status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 4 -u "$BITRIVER_OME_USERNAME:$BITRIVER_OME_PASSWORD" "$health_url")"
                    [ "$http_status" = "200" ]
                  }

                  probe_unauthenticated() {
                    http_status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 4 "$health_url")"
                    [ "$http_status" = "200" ]
                  }

                  case "$auth_mode" in
                    accesstoken)
                      if [ -z "$token" ]; then
                        echo "[$probe_source] OME healthcheck misconfigured in $probe_config: BITRIVER_OME_HEALTHCHECK_TOKEN, BITRIVER_OME_ACCESS_TOKEN, and BITRIVER_OME_API_TOKEN are all empty inside the container" >&2
                        exit 1
                      fi

                      if printf '%s' "$token" | grep -Eq '^[[:space:]]*Bearer[[:space:]]+'; then
                        echo "[$probe_source] OME healthcheck auth mismatch in $probe_config: auth_mode=$auth_mode expects raw token values because probe adds Authorization: Bearer" >&2
                        exit 1
                      fi

                      echo "[$probe_source] OME healthcheck startup auth_mode=$auth_mode credential_type=access_token source=$token_source value=<redacted>"
                      ;;
                    basic)
                      if [ -z "${BITRIVER_OME_USERNAME:-}" ] || [ -z "${BITRIVER_OME_PASSWORD:-}" ]; then
                        echo "[$probe_source] OME healthcheck misconfigured in $probe_config: BITRIVER_OME_USERNAME and BITRIVER_OME_PASSWORD must both be set for basic auth mode" >&2
                        exit 1
                      fi

                      echo "[$probe_source] OME healthcheck startup auth_mode=$auth_mode credential_type=username_password username=<redacted> password=<redacted>"
                      ;;
                    none|disabled|off)
                      echo "[$probe_source] OME healthcheck startup auth_mode=$auth_mode credential_type=none"
                      ;;
                    *)
                      echo "[$probe_source] OME healthcheck misconfigured in $probe_config: unsupported BITRIVER_OME_HEALTHCHECK_AUTH_MODE=$auth_mode (expected accesstoken, basic, or none/off/disabled)" >&2
                      exit 1
                      ;;
                  esac

                  if { [ "$auth_mode" = "accesstoken" ] && probe_access_token; } || { [ "$auth_mode" = "basic" ] && probe_basic_auth; } || { [ "$auth_mode" = "none" ] && probe_unauthenticated; } || { [ "$auth_mode" = "off" ] && probe_unauthenticated; } || { [ "$auth_mode" = "disabled" ] && probe_unauthenticated; }; then
                    echo "[$probe_source] OME healthcheck succeeded with auth_mode=$auth_mode http_status=${http_status:-unknown}"
                    exit 0
                  fi

                  echo "[$probe_source] OME healthcheck failed for $health_url using auth_mode=$auth_mode from $probe_config" >&2
                  exit 1
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: ome-conf
              mountPath: /opt/ovenmediaengine/bin/origin_conf/Server.xml
              subPath: Server.xml
            - name: ome-conf
              mountPath: /opt/ovenmediaengine/bin/edge_conf/Server.xml
              subPath: Server.xml
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: ome-conf
          secret:
            secretName: {{ include "bitriver-live.fullname" . }}-ome-conf
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bitriver-live.fullname" . }}-ome
  labels:
    {{- include "bitriver-live.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.ome.type }}
  ports:
    - name: api
      port: {{ .Values.service.ome.apiPort }}
      targetPort: api
    - name: llhls
      port: {{ .Values.ome.llhlsPort }}
      targetPort: llhls
    - name: llhls-tls
      port: {{ .Values.ome.llhlsTlsPort }}
      targetPort: llhls-tls
    - name: signalling
      port: {{ .Values.service.ome.signallingPort }}
      targetPort: signalling
    - name: signalling-tls
      port: {{ .Values.service.ome.tlsPort }}
      targetPort: signalling-tls
    - name: relay-tcp
      port: {{ .Values.service.ome.relayPort }}
      targetPort: relay-tcp
      protocol: TCP
    - name: relay-udp
      port: {{ .Values.service.ome.relayPort }}
      targetPort: relay-udp
      protocol: UDP
{{- range $index, $port := .Values.service.ome.icePorts }}
    - name: ice-udp-{{ $port }}
      port: {{ $port }}
      targetPort: ice-udp-{{ $port }}
      protocol: UDP
{{- end }}
  selector:
    {{- include "bitriver-live.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ome
