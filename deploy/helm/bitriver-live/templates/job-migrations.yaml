apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bitriver-live.fullname" . }}-postgres-migrations
  labels:
    {{- include "bitriver-live.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "bitriver-live.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: {{ .Values.images.postgres }}:{{ .Values.tags.postgres }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bitriver-live.fullname" . }}-secrets
                  key: BITRIVER_POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "bitriver-live.fullname" . }}-secrets
                  key: BITRIVER_POSTGRES_USER
            - name: POSTGRES_DB
              value: {{ .Values.env.BITRIVER_POSTGRES_DB | quote }}
            - name: PGHOST
              value: {{ printf "%s-postgres" (include "bitriver-live.fullname" .) | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "bitriver-live.fullname" . }}-secrets
                  key: BITRIVER_POSTGRES_USER
            - name: PGDATABASE
              value: {{ .Values.env.BITRIVER_POSTGRES_DB | quote }}
            - name: BITRIVER_MIGRATION_RELEASE
              value: {{ .Values.tags.api | quote }}
            - name: BITRIVER_MIGRATION_COMMIT
              value: {{ .Values.releaseCommit | default "unknown" | quote }}
          command:
            - /bin/sh
            - /migrations/runner.sh
            - apply
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: {{ include "bitriver-live.fullname" . }}-migrations
            defaultMode: 0555
