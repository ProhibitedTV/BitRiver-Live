x-required-credentials: &required_credentials
  # Populate these credentials in ../.env before starting the stack.
  BITRIVER_LIVE_ADMIN_EMAIL: ${BITRIVER_LIVE_ADMIN_EMAIL:?set via .env}
  BITRIVER_LIVE_ADMIN_PASSWORD: ${BITRIVER_LIVE_ADMIN_PASSWORD:?set via .env}
  BITRIVER_SRS_TOKEN: ${BITRIVER_SRS_TOKEN:?set via .env}
  BITRIVER_OME_USERNAME: ${BITRIVER_OME_USERNAME:?set via .env}
  BITRIVER_OME_PASSWORD: ${BITRIVER_OME_PASSWORD:?set via .env}
  BITRIVER_TRANSCODER_TOKEN: ${BITRIVER_TRANSCODER_TOKEN:?set via .env}
  BITRIVER_REDIS_PASSWORD: ${BITRIVER_REDIS_PASSWORD:?set via .env}
  BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD: ${BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD:?set via .env}

services:
  # Compose keeps both image + build directives; cmd/bitriver selects pull-only
  # or build mode via BITRIVER_DEPLOY_IMAGE_SOURCE (or --image-source).
  bitriver-live:
    image: ${BITRIVER_IMAGE_NAMESPACE:-ghcr.io/prohibitedtv}/bitriver-live:${BITRIVER_LIVE_IMAGE_TAG:?set via .env}${BITRIVER_LIVE_IMAGE_DIGEST:-}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-direct}
        GOSUMDB: ${GOSUMDB:-off}
        BITRIVER_PGX_MODE: ${BITRIVER_PGX_MODE:-real}
    container_name: bitriver-live
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    # Managed Linux hosts run bind-writing services as the Docker operator.
    # Source/desktop starts retain the image UID when no host identity is set.
    user: "${BITRIVER_HOST_UID:-65532}:${BITRIVER_HOST_GID:-65532}"
    env_file:
      - ../.env
    ports:
      - "${BITRIVER_LIVE_PORT:-8080}:8080"
    environment:
      <<: *required_credentials
      BITRIVER_LIVE_STORAGE_DRIVER: ${BITRIVER_LIVE_STORAGE_DRIVER:-postgres}
      BITRIVER_LIVE_SESSION_STORE: ${BITRIVER_LIVE_SESSION_STORE:-postgres}
      BITRIVER_LIVE_SESSION_TTL: ${BITRIVER_LIVE_SESSION_TTL:-168h}
      BITRIVER_LIVE_SESSION_IDLE_TIMEOUT: ${BITRIVER_LIVE_SESSION_IDLE_TIMEOUT:-0}
      BITRIVER_LIVE_MODE: ${BITRIVER_LIVE_MODE:-production}
      BITRIVER_LIVE_ALLOW_SELF_SIGNUP: ${BITRIVER_LIVE_ALLOW_SELF_SIGNUP:-false}
      BITRIVER_LIVE_ADDR: ${BITRIVER_LIVE_ADDR:-:8080}
      BITRIVER_LIVE_POSTGRES_DSN: ${BITRIVER_LIVE_POSTGRES_DSN:-postgres://${BITRIVER_POSTGRES_USER:?set via .env}:${BITRIVER_POSTGRES_PASSWORD:?set via .env}@postgres:5432/${BITRIVER_POSTGRES_DB:-bitriver}?sslmode=disable}
      # Sessions reuse BITRIVER_LIVE_POSTGRES_DSN when BITRIVER_LIVE_SESSION_POSTGRES_DSN is unset.
      BITRIVER_LIVE_POSTGRES_MAX_CONNS: ${BITRIVER_LIVE_POSTGRES_MAX_CONNS:-15}
      BITRIVER_LIVE_POSTGRES_MIN_CONNS: ${BITRIVER_LIVE_POSTGRES_MIN_CONNS:-5}
      BITRIVER_LIVE_POSTGRES_ACQUIRE_TIMEOUT: ${BITRIVER_LIVE_POSTGRES_ACQUIRE_TIMEOUT:-5s}
      BITRIVER_LIVE_POSTGRES_MAX_CONN_LIFETIME: ${BITRIVER_LIVE_POSTGRES_MAX_CONN_LIFETIME:-30m}
      BITRIVER_VIEWER_ORIGIN: ${BITRIVER_VIEWER_ORIGIN:-http://viewer:3000}
      BITRIVER_SRS_API: ${BITRIVER_SRS_API:-http://srs-controller:1985}
      BITRIVER_OME_API: ${BITRIVER_OME_API:-http://ome:${BITRIVER_OME_HTTP_PORT:-8081}}
      BITRIVER_OME_LLHLS_ORIGIN: ${BITRIVER_OME_LLHLS_ORIGIN:-http://ome:${BITRIVER_OME_LLHLS_PORT:-8080}}
      BITRIVER_OME_PUBLIC_LLHLS_BASE_URL: ${BITRIVER_OME_PUBLIC_LLHLS_BASE_URL:?set via .env}
      BITRIVER_TRANSCODER_API: ${BITRIVER_TRANSCODER_API:-http://transcoder:9000}
      BITRIVER_TRANSCODE_LADDER: ${BITRIVER_TRANSCODE_LADDER:-}
      BITRIVER_INGEST_HEALTH: ${BITRIVER_INGEST_HEALTH:-/healthz}
      BITRIVER_LIVE_CHAT_QUEUE_DRIVER: ${BITRIVER_LIVE_CHAT_QUEUE_DRIVER:-redis}
      BITRIVER_LIVE_CHAT_QUEUE_REDIS_ADDR: ${BITRIVER_LIVE_CHAT_QUEUE_REDIS_ADDR:-redis:6379}
      BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD: ${BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD:?set via .env}
      BITRIVER_LIVE_CHAT_QUEUE_REDIS_STREAM: ${BITRIVER_LIVE_CHAT_QUEUE_REDIS_STREAM:-bitriver-live-chat}
      BITRIVER_LIVE_CHAT_QUEUE_REDIS_GROUP: ${BITRIVER_LIVE_CHAT_QUEUE_REDIS_GROUP:-bitriver-live-api}
      # Enable HTTPS by mounting certs and uncommenting the lines below (the setup wizard stages certs in deploy/certs/ by default).
      # BITRIVER_LIVE_TLS_CERT: /certs/fullchain.pem
      # BITRIVER_LIVE_TLS_KEY: /certs/privkey.pem
      # Tune rate limiting and shared state.
      # BITRIVER_LIVE_RATE_GLOBAL_RPS: "50"
      # BITRIVER_LIVE_RATE_GLOBAL_BURST: "100"
      # BITRIVER_LIVE_RATE_LOGIN_LIMIT: "5"
      # BITRIVER_LIVE_RATE_LOGIN_WINDOW: 2m
      # BITRIVER_LIVE_RATE_REDIS_ADDR: redis:6379
      # BITRIVER_LIVE_RATE_REDIS_PASSWORD: supersecret
    volumes:
      - ./data:/var/lib/bitriver-live
      # - ./certs:/certs
    tmpfs:
      - /tmp
    command: ["/app/bitriver-live"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      postgres-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      srs-controller:
        condition: service_healthy
      ome:
        condition: service_healthy
      transcoder:
        condition: service_healthy
    networks:
      - public
      - internal

  viewer:
    image: ${BITRIVER_IMAGE_NAMESPACE:-ghcr.io/prohibitedtv}/bitriver-viewer:${BITRIVER_VIEWER_IMAGE_TAG:?set via .env}${BITRIVER_VIEWER_IMAGE_DIGEST:-}
    build:
      context: ../web/viewer
    container_name: bitriver-viewer
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    # Node official runtime supports the non-root `node` user.
    user: "node"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-""}
      NEXT_VIEWER_BASE_PATH: ${NEXT_VIEWER_BASE_PATH:-/viewer}
      NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL:-http://localhost:8080/viewer}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    tmpfs:
      - /tmp
    depends_on:
      - bitriver-live
    networks:
      - internal

  redis:
    image: redis:7-alpine${BITRIVER_REDIS_IMAGE_DIGEST:-}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Exception: Redis image manages runtime config under the container filesystem.
    # Exception: retain image default root user for upstream redis entrypoint compatibility.
    # Exception: upstream entrypoint must chown /data and drop privileges to the redis user.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--requirepass"
      - "${BITRIVER_REDIS_PASSWORD:?set via .env}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${BITRIVER_REDIS_PASSWORD:?set via .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

  postgres:
    image: postgres:15-alpine${BITRIVER_POSTGRES_IMAGE_DIGEST:-}
    container_name: bitriver-postgres
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Exception: Postgres init/runtime writes beyond mounted data dir during startup.
    # Exception: retain image default user; upstream postgres entrypoint handles UID/GID setup.
    # Exception: upstream entrypoint must chmod/chown PGDATA and drop privileges to postgres.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    environment:
      POSTGRES_DB: ${BITRIVER_POSTGRES_DB:-bitriver}
      POSTGRES_USER: ${BITRIVER_POSTGRES_USER:?set via .env}
      POSTGRES_PASSWORD: ${BITRIVER_POSTGRES_PASSWORD:?set via .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  postgres-migrations:
    image: postgres:15-alpine${BITRIVER_POSTGRES_IMAGE_DIGEST:-}
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    # Exception: keep image default user for psql tooling compatibility in one-shot migration job.
    env_file:
      - ../.env
    environment:
      PGPASSWORD: ${BITRIVER_POSTGRES_PASSWORD:?set via .env}
      PGHOST: postgres
      PGUSER: ${BITRIVER_POSTGRES_USER:?set via .env}
      PGDATABASE: ${BITRIVER_POSTGRES_DB:-bitriver}
      BITRIVER_MIGRATION_RELEASE: ${BITRIVER_LIVE_IMAGE_TAG:-unknown}
      BITRIVER_MIGRATION_COMMIT: ${BITRIVER_RELEASE_COMMIT:-unknown}
    volumes:
      - ./migrations:/migrations:ro
      - ./postgres-migrate.sh:/usr/local/bin/bitriver-postgres-migrate:ro
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /usr/local/bin/bitriver-postgres-migrate
    command: ["apply"]
    networks:
      - internal

  # Optional sidecar that publishes PostgreSQL to the host when COMPOSE_PROFILES
  # includes "postgres-host". Leave the profile disabled to keep the database
  # network-isolated inside the compose project.
  postgres-host-port:
    image: alpine:3${BITRIVER_ALPINE_3_IMAGE_DIGEST:-}
    container_name: bitriver-postgres-host-port
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_started
    profiles:
      - postgres-host
    ports:
      - "${BITRIVER_POSTGRES_HOST_PORT:-5432}:5432"

  srs-controller:
    image: ${BITRIVER_IMAGE_NAMESPACE:-ghcr.io/prohibitedtv}/bitriver-srs-controller:${BITRIVER_SRS_CONTROLLER_IMAGE_TAG:?set via .env}${BITRIVER_SRS_CONTROLLER_IMAGE_DIGEST:-}
    build:
      context: ..
      dockerfile: cmd/srs-controller/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-direct}
        GOSUMDB: ${GOSUMDB:-off}
    container_name: bitriver-srs-controller
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    # Runtime image sets USER appuser (uid 10002); keep explicit for compose clarity.
    user: "10002:10002"
    env_file:
      - ../.env
    environment:
      BITRIVER_SRS_TOKEN: ${BITRIVER_SRS_TOKEN:?set via .env}
      SRS_CONTROLLER_BIND: :1985
      SRS_CONTROLLER_UPSTREAM: ${SRS_CONTROLLER_UPSTREAM:-http://srs:1985/api/}
      SRS_CONTROLLER_PUBLIC_RTMP_BASE_URL: ${BITRIVER_SRS_PUBLIC_RTMP_BASE_URL:?set via .env}
      SRS_CONTROLLER_INTERNAL_RTMP_BASE_URL: ${SRS_CONTROLLER_INTERNAL_RTMP_BASE_URL:-rtmp://srs:1935/live}
    ports:
      - "${BITRIVER_SRS_CONTROLLER_PORT:-1986}:1985"
    depends_on:
      - srs
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1985/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - public
      - internal

  srs:
    image: ossrs/srs:${BITRIVER_SRS_IMAGE_TAG:-v5.0.185}${BITRIVER_SRS_IMAGE_DIGEST:-}
    build:
      context: ..
      dockerfile: deploy/srs/Dockerfile
      args:
        SRS_VERSION: ${BITRIVER_SRS_IMAGE_TAG:-v5.0.185}
    container_name: bitriver-srs
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    group_add:
      - "${BITRIVER_HOST_GID:-0}"
    # Exception: upstream SRS image writes process/log artifacts under /usr/local/srs.
    # Exception: retain image default root user; upstream image is not documented for non-root startup.
    ports:
      - "${BITRIVER_SRS_RTMP_PORT:-1935}:1935"
    volumes:
      - ./srs/conf/srs.generated.conf:/usr/local/srs/conf/srs.conf:ro
    depends_on:
      srs-config:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD"
        - "/bin/bash"
        - "-ec"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/1985;
          printf 'GET /api/v1/versions HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          IFS=' ' read -r _ status _ <&3;
          test "$$status" = "200"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - public
      - internal

  # Optional profile to publish the SRS HTTP API (1985) to the host for debugging.
  srs-api:
    profiles:
      - srs-api
    image: alpine:3.19${BITRIVER_ALPINE_3_19_IMAGE_DIGEST:-}
    container_name: bitriver-srs-api
    command: ["sh", "-c", "sleep infinity"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    network_mode: "service:srs"
    depends_on:
      - srs
    ports:
      - "${BITRIVER_SRS_API_PORT:-1985}:1985"

  srs-config:
    image: debian:12-slim${BITRIVER_DEBIAN_IMAGE_DIGEST:-}
    container_name: bitriver-srs-config
    working_dir: /workspace
    # Render via a sanitized tmpfs copy while keeping installed/source assets read-only.
    command: ["bash", "-lc", "tr -d '\\r' < /workspace/scripts/render-srs-config.sh > /tmp/render-srs-config.sh && REPO_ROOT=/workspace OUTPUT_FILE=/etc/bitriver-live/deploy/srs/conf/srs.generated.conf exec bash /tmp/render-srs-config.sh --env-file /workspace/.env --force"]
    user: "${BITRIVER_HOST_UID:-0}:${BITRIVER_HOST_GID:-0}"
    volumes:
      - ..:/workspace:ro
      - "${BITRIVER_CONFIG_ROOT:-..}:/etc/bitriver-live"
    env_file:
      - ../.env
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    # The only writable bind is the operator-owned generated-config directory.
    networks:
      - internal

  ome-config:
    build:
      context: ..
      dockerfile: deploy/ome-config/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-direct}
        GOSUMDB: ${GOSUMDB:-off}
    image: ${BITRIVER_IMAGE_NAMESPACE:-ghcr.io/prohibitedtv}/bitriver-ome-config:${BITRIVER_OME_CONFIG_IMAGE_TAG:-${BITRIVER_LIVE_IMAGE_TAG:?set via .env}}${BITRIVER_OME_CONFIG_IMAGE_DIGEST:-}
    working_dir: /workspace
    command: ["ome", "render", "--env-file", "/workspace/.env", "--output", "/etc/bitriver-live/deploy/ome/Server.generated.xml", "--force"]
    user: "${BITRIVER_HOST_UID:-0}:${BITRIVER_HOST_GID:-0}"
    volumes:
      - ..:/workspace:ro
      - "${BITRIVER_CONFIG_ROOT:-..}:/etc/bitriver-live"
    env_file:
      - ../.env
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    # The only writable bind is the operator-owned generated-config directory.
    networks:
      - internal

  ome-health-token-check:
    image: ${BITRIVER_IMAGE_NAMESPACE:-ghcr.io/prohibitedtv}/bitriver-ome-config:${BITRIVER_OME_CONFIG_IMAGE_TAG:-${BITRIVER_LIVE_IMAGE_TAG:?set via .env}}${BITRIVER_OME_CONFIG_IMAGE_DIGEST:-}
    container_name: bitriver-ome-health-token-check
    working_dir: /workspace
    command: ["ome", "verify-health-token", "--env-file", "/workspace/.env", "--config", "/etc/bitriver-live/deploy/ome/Server.generated.xml"]
    user: "${BITRIVER_HOST_UID:-0}:${BITRIVER_HOST_GID:-0}"
    volumes:
      - ..:/workspace:ro
      - "${BITRIVER_CONFIG_ROOT:-..}:/etc/bitriver-live:ro"
    env_file:
      - ../.env
    depends_on:
      ome-config:
        condition: service_completed_successfully
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal

  ome:
    image: airensoft/ovenmediaengine:${BITRIVER_OME_IMAGE_TAG:-0.16.0}${BITRIVER_OME_IMAGE_DIGEST:-}
    container_name: bitriver-ome
    hostname: ome
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    group_add:
      - "${BITRIVER_HOST_GID:-0}"
    # Exception: OME runtime uses writable paths inside its image layout.
    # Exception: retain image default root user; vendor image startup expectations are root-based.
    entrypoint:
      - sh
      - -ec
    command:
      - |
        auth_mode="$${BITRIVER_OME_HEALTHCHECK_AUTH_MODE:-accesstoken}"
        token="$${BITRIVER_OME_HEALTHCHECK_TOKEN:-}"
        if [ -z "$$token" ]; then token="$${BITRIVER_OME_API_TOKEN:-}"; fi

        case "$$auth_mode" in
          accesstoken)
            if [ -z "$$token" ]; then
              echo "bitriver-ome startup failed: canonical token is empty (BITRIVER_OME_HEALTHCHECK_TOKEN -> BITRIVER_OME_API_TOKEN)" >&2
              exit 1
            fi
            ;;
          basic)
            if [ -z "$${BITRIVER_OME_USERNAME:-}" ] || [ -z "$${BITRIVER_OME_PASSWORD:-}" ]; then
              echo "bitriver-ome startup failed: basic auth mode requires BITRIVER_OME_USERNAME and BITRIVER_OME_PASSWORD" >&2
              exit 1
            fi
            ;;
          none|disabled|off)
            ;;
          *)
            echo "bitriver-ome startup failed: unsupported BITRIVER_OME_HEALTHCHECK_AUTH_MODE=$$auth_mode (expected accesstoken, basic, or none/off/disabled)" >&2
            exit 1
            ;;
        esac

        if [ "$$auth_mode" = "accesstoken" ]; then
          token_source="BITRIVER_OME_HEALTHCHECK_TOKEN"
          if [ -z "$${BITRIVER_OME_HEALTHCHECK_TOKEN:-}" ]; then token_source="BITRIVER_OME_API_TOKEN"; fi
          echo "[bitriver-ome] healthcheck startup auth_mode=$$auth_mode credential_type=access_token source=$$token_source value=<redacted>" >&2
        elif [ "$$auth_mode" = "basic" ]; then
          echo "[bitriver-ome] healthcheck startup auth_mode=$$auth_mode credential_type=username_password username=<redacted> password=<redacted>" >&2
        else
          echo "[bitriver-ome] healthcheck startup auth_mode=$$auth_mode credential_type=none" >&2
        fi

        exec /opt/ovenmediaengine/bin/OvenMediaEngine -c origin_conf
    volumes:
      - ./ome/Server.generated.xml:/opt/ovenmediaengine/bin/origin_conf/Server.xml:ro
      - ./ome/Server.generated.xml:/opt/ovenmediaengine/bin/edge_conf/Server.xml:ro
    environment:
      BITRIVER_OME_USERNAME: ${BITRIVER_OME_USERNAME:?set via .env}
      BITRIVER_OME_PASSWORD: ${BITRIVER_OME_PASSWORD:?set via .env}
      BITRIVER_OME_HEALTHCHECK_AUTH_MODE: ${BITRIVER_OME_HEALTHCHECK_AUTH_MODE:-accesstoken}
      BITRIVER_OME_HEALTHCHECK_TOKEN: ${BITRIVER_OME_HEALTHCHECK_TOKEN:-}
      BITRIVER_OME_API_TOKEN: ${BITRIVER_OME_API_TOKEN:?set via .env}
    networks:
      public:
      internal:
        aliases:
          - ome
    ports:
      - "${BITRIVER_OME_HTTP_PORT:-8081}:${BITRIVER_OME_HTTP_PORT:-8081}"
      - "${BITRIVER_OME_HTTP_TLS_PORT:-8082}:${BITRIVER_OME_HTTP_TLS_PORT:-8082}"
      - "${BITRIVER_OME_LLHLS_HOST_PORT:-${BITRIVER_OME_LLHLS_PORT:-8080}}:${BITRIVER_OME_LLHLS_PORT:-8080}"
      - "${BITRIVER_OME_LLHLS_TLS_PORT:-8443}:${BITRIVER_OME_LLHLS_TLS_PORT:-8443}"
      - "${BITRIVER_OME_SIGNALLING_PORT:-${BITRIVER_OME_SERVER_PORT:-9000}}:${BITRIVER_OME_SERVER_PORT:-9000}"
      - "${BITRIVER_OME_SERVER_TLS_PORT:-9443}:${BITRIVER_OME_SERVER_TLS_PORT:-9443}"
      - "${BITRIVER_OME_RELAY_PORT:-3478}:3478/udp"
      - "${BITRIVER_OME_RELAY_PORT:-3478}:3478/${BITRIVER_OME_RELAY_PROTOCOL:-tcp}"
      - "${BITRIVER_OME_ICE_PORT_RANGE:-10000-10009}:10000-10009/udp"
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          probe_source="bitriver-ome"
          probe_config="deploy/docker-compose.yml"
          health_url="http://localhost:${BITRIVER_OME_HTTP_PORT:-8081}/"
          http_status="$$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 4 "$$health_url")"

          if [ -n "$$http_status" ] && [ "$$http_status" != "000" ] && [ "$$http_status" -lt 500 ]; then
            echo "[$$probe_source] OME healthcheck succeeded with unauthenticated endpoint $$health_url http_status=$$http_status"
            exit 0
          fi

          echo "[$$probe_source] OME healthcheck failed for $$health_url from $$probe_config http_status=$${http_status:-unknown}" >&2
          exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      ome-health-token-check:
        condition: service_completed_successfully

  transcoder:
    image: ${BITRIVER_IMAGE_NAMESPACE:-ghcr.io/prohibitedtv}/bitriver-transcoder:${BITRIVER_TRANSCODER_IMAGE_TAG:?set via .env}${BITRIVER_TRANSCODER_IMAGE_DIGEST:-}
    build:
      context: ..
      dockerfile: cmd/transcoder/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-direct}
        GOSUMDB: ${GOSUMDB:-off}
    container_name: bitriver-transcoder
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    # Managed Linux hosts run bind-writing services as the Docker operator.
    # Source/desktop starts retain the image UID when no host identity is set.
    user: "${BITRIVER_HOST_UID:-10001}:${BITRIVER_HOST_GID:-10001}"
    ports:
      - "${BITRIVER_TRANSCODER_HOST_PORT:-9001}:9000"
    environment:
      JOB_CONTROLLER_BIND: :9000
      JOB_CONTROLLER_TOKEN: ${BITRIVER_TRANSCODER_TOKEN:?set via .env}
      BITRIVER_TRANSCODER_PUBLIC_BASE_URL: ${BITRIVER_TRANSCODER_PUBLIC_BASE_URL:?set via .env}
      BITRIVER_TRANSCODER_PUBLIC_DIR: ${BITRIVER_TRANSCODER_PUBLIC_DIR:-/work/public}
      BITRIVER_TRANSCODER_RETENTION_LIVE: ${BITRIVER_TRANSCODER_RETENTION_LIVE:-}
      BITRIVER_TRANSCODER_RETENTION_UPLOADS: ${BITRIVER_TRANSCODER_RETENTION_UPLOADS:-}
    volumes:
      - ./transcoder-data:/work
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - public
      - internal

  transcoder-public:
    image: nginx:alpine${BITRIVER_NGINX_IMAGE_DIGEST:-}
    container_name: bitriver-transcoder-public
    depends_on:
      - transcoder
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    # Exception: retain image default root user; nginx binds and manages runtime state internally.
    # Exception: nginx startup adjusts cache directory ownership under /var/cache/nginx.
    # Exception: nginx also drops privileges to the bundled nginx user after startup.
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    ports:
      - "${BITRIVER_TRANSCODER_PUBLIC_PORT:-9080}:8080"
    volumes:
      - ./transcoder-data:/work:ro
      - ./nginx/transcoder-public.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - public

volumes:
  redis-data:
  data:
  postgres-data:

networks:
  public:
  internal:
