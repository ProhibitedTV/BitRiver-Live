x-required-credentials: &required_credentials
  # Populate these credentials in ../.env before starting the stack.
  BITRIVER_LIVE_ADMIN_EMAIL: ${BITRIVER_LIVE_ADMIN_EMAIL:?set via .env}
  BITRIVER_LIVE_ADMIN_PASSWORD: ${BITRIVER_LIVE_ADMIN_PASSWORD:?set via .env}
  BITRIVER_SRS_TOKEN: ${BITRIVER_SRS_TOKEN:?set via .env}
  BITRIVER_OME_USERNAME: ${BITRIVER_OME_USERNAME:?set via .env}
  BITRIVER_OME_PASSWORD: ${BITRIVER_OME_PASSWORD:?set via .env}
  BITRIVER_TRANSCODER_TOKEN: ${BITRIVER_TRANSCODER_TOKEN:?set via .env}
  BITRIVER_REDIS_PASSWORD: ${BITRIVER_REDIS_PASSWORD:?set via .env}
  BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD: ${BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD:?set via .env}

services:
  bitriver-live:
    image: ghcr.io/bitriver-live/bitriver-live:${BITRIVER_LIVE_IMAGE_TAG:?set via .env}${BITRIVER_LIVE_IMAGE_DIGEST:-}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-direct}
        GOSUMDB: ${GOSUMDB:-off}
    container_name: bitriver-live
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${BITRIVER_LIVE_PORT:-8080}:8080"
    environment:
      <<: *required_credentials
      BITRIVER_LIVE_STORAGE_DRIVER: ${BITRIVER_LIVE_STORAGE_DRIVER:-postgres}
      BITRIVER_LIVE_SESSION_STORE: ${BITRIVER_LIVE_SESSION_STORE:-postgres}
      BITRIVER_LIVE_SESSION_TTL: ${BITRIVER_LIVE_SESSION_TTL:-168h}
      BITRIVER_LIVE_SESSION_IDLE_TIMEOUT: ${BITRIVER_LIVE_SESSION_IDLE_TIMEOUT:-0}
      BITRIVER_LIVE_MODE: ${BITRIVER_LIVE_MODE:-production}
      BITRIVER_LIVE_ALLOW_SELF_SIGNUP: ${BITRIVER_LIVE_ALLOW_SELF_SIGNUP:-false}
      BITRIVER_LIVE_ADDR: ${BITRIVER_LIVE_ADDR:-:8080}
      BITRIVER_LIVE_POSTGRES_DSN: ${BITRIVER_LIVE_POSTGRES_DSN:-postgres://${BITRIVER_POSTGRES_USER:?set via .env}:${BITRIVER_POSTGRES_PASSWORD:?set via .env}@postgres:5432/${BITRIVER_POSTGRES_DB:-bitriver}?sslmode=disable}
      # Sessions reuse BITRIVER_LIVE_POSTGRES_DSN when BITRIVER_LIVE_SESSION_POSTGRES_DSN is unset.
      BITRIVER_LIVE_POSTGRES_MAX_CONNS: ${BITRIVER_LIVE_POSTGRES_MAX_CONNS:-15}
      BITRIVER_LIVE_POSTGRES_MIN_CONNS: ${BITRIVER_LIVE_POSTGRES_MIN_CONNS:-5}
      BITRIVER_LIVE_POSTGRES_ACQUIRE_TIMEOUT: ${BITRIVER_LIVE_POSTGRES_ACQUIRE_TIMEOUT:-5s}
      BITRIVER_LIVE_POSTGRES_MAX_CONN_LIFETIME: ${BITRIVER_LIVE_POSTGRES_MAX_CONN_LIFETIME:-30m}
      BITRIVER_VIEWER_ORIGIN: ${BITRIVER_VIEWER_ORIGIN:-http://viewer:3000}
      BITRIVER_SRS_API: ${BITRIVER_SRS_API:-http://srs-controller:1985}
      BITRIVER_OME_API: ${BITRIVER_OME_API:-http://ome:${BITRIVER_OME_HTTP_PORT:-8081}}
      BITRIVER_TRANSCODER_API: ${BITRIVER_TRANSCODER_API:-http://transcoder:9000}
      BITRIVER_INGEST_HEALTH: ${BITRIVER_INGEST_HEALTH:-/healthz}
      BITRIVER_LIVE_CHAT_QUEUE_DRIVER: ${BITRIVER_LIVE_CHAT_QUEUE_DRIVER:-redis}
      BITRIVER_LIVE_CHAT_QUEUE_REDIS_ADDR: ${BITRIVER_LIVE_CHAT_QUEUE_REDIS_ADDR:-redis:6379}
      BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD: ${BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD:?set via .env}
      BITRIVER_LIVE_CHAT_QUEUE_REDIS_STREAM: ${BITRIVER_LIVE_CHAT_QUEUE_REDIS_STREAM:-bitriver-live-chat}
      BITRIVER_LIVE_CHAT_QUEUE_REDIS_GROUP: ${BITRIVER_LIVE_CHAT_QUEUE_REDIS_GROUP:-bitriver-live-api}
      # Enable HTTPS by mounting certs and uncommenting the lines below (the setup wizard stages certs in deploy/certs/ by default).
      # BITRIVER_LIVE_TLS_CERT: /certs/fullchain.pem
      # BITRIVER_LIVE_TLS_KEY: /certs/privkey.pem
      # Tune rate limiting and shared state.
      # BITRIVER_LIVE_RATE_GLOBAL_RPS: "50"
      # BITRIVER_LIVE_RATE_GLOBAL_BURST: "100"
      # BITRIVER_LIVE_RATE_LOGIN_LIMIT: "5"
      # BITRIVER_LIVE_RATE_LOGIN_WINDOW: 2m
      # BITRIVER_LIVE_RATE_REDIS_ADDR: redis:6379
      # BITRIVER_LIVE_RATE_REDIS_PASSWORD: supersecret
    volumes:
      - ./data:/var/lib/bitriver-live
      # - ./certs:/certs
    command: ["/app/bitriver-live"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      postgres-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      srs-controller:
        condition: service_started
      ome:
        condition: service_healthy
      transcoder:
        condition: service_started

  viewer:
    image: ghcr.io/bitriver-live/bitriver-viewer:${BITRIVER_VIEWER_IMAGE_TAG:?set via .env}${BITRIVER_VIEWER_IMAGE_DIGEST:-}
    build:
      context: ../web/viewer
    container_name: bitriver-viewer
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-""}
      NEXT_VIEWER_BASE_PATH: ${NEXT_VIEWER_BASE_PATH:-/viewer}
      NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL:-http://localhost:8080/viewer}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    depends_on:
      - bitriver-live

  redis:
    image: redis:7-alpine${BITRIVER_REDIS_IMAGE_DIGEST:-}
    restart: unless-stopped
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--requirepass"
      - "${BITRIVER_REDIS_PASSWORD:?set via .env}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${BITRIVER_REDIS_PASSWORD:?set via .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:15-alpine${BITRIVER_POSTGRES_IMAGE_DIGEST:-}
    container_name: bitriver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BITRIVER_POSTGRES_DB:-bitriver}
      POSTGRES_USER: ${BITRIVER_POSTGRES_USER:?set via .env}
      POSTGRES_PASSWORD: ${BITRIVER_POSTGRES_PASSWORD:?set via .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-migrations:
    image: postgres:15-alpine${BITRIVER_POSTGRES_IMAGE_DIGEST:-}
    restart: "no"
    env_file:
      - ../.env
    environment:
      PGPASSWORD: ${BITRIVER_POSTGRES_PASSWORD:?set via .env}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      if ! ls /migrations/*.sql >/dev/null 2>&1; then
        echo "No Postgres migrations found; exiting."
        exit 1
      fi

      for file in /migrations/*.sql; do
        echo "Applying $$file"
        psql \
          -h postgres \
          -U "${BITRIVER_POSTGRES_USER:?set via .env}" \
          -d "${BITRIVER_POSTGRES_DB:-bitriver}" \
          -v ON_ERROR_STOP=1 \
          -f "$${file}"
      done

      echo "Running post-migration sanity check"
      psql \
        -h postgres \
        -U "${BITRIVER_POSTGRES_USER:?set via .env}" \
        -d "${BITRIVER_POSTGRES_DB:-bitriver}" \
        -v ON_ERROR_STOP=1 \
        -c "SELECT 1 FROM users LIMIT 1;"

      echo "Postgres migrations completed."

  # Optional sidecar that publishes PostgreSQL to the host when COMPOSE_PROFILES
  # includes "postgres-host". Leave the profile disabled to keep the database
  # network-isolated inside the compose project.
  postgres-host-port:
    image: alpine:3${BITRIVER_ALPINE_3_IMAGE_DIGEST:-}
    container_name: bitriver-postgres-host-port
    restart: unless-stopped
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_started
    profiles:
      - postgres-host
    ports:
      - "${BITRIVER_POSTGRES_HOST_PORT:-5432}:5432"

  srs-controller:
    image: ghcr.io/bitriver-live/bitriver-srs-controller:${BITRIVER_SRS_CONTROLLER_IMAGE_TAG:?set via .env}${BITRIVER_SRS_CONTROLLER_IMAGE_DIGEST:-}
    build:
      context: ..
      dockerfile: cmd/srs-controller/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-direct}
        GOSUMDB: ${GOSUMDB:-off}
    container_name: bitriver-srs-controller
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      BITRIVER_SRS_TOKEN: ${BITRIVER_SRS_TOKEN:?set via .env}
      SRS_CONTROLLER_BIND: :1985
      SRS_CONTROLLER_UPSTREAM: ${SRS_CONTROLLER_UPSTREAM:-http://srs:1985/api/}
    ports:
      - "${BITRIVER_SRS_CONTROLLER_PORT:-1986}:1985"
    depends_on:
      - srs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1985/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  srs:
    image: ossrs/srs:${BITRIVER_SRS_IMAGE_TAG:-v5.0.185}${BITRIVER_SRS_IMAGE_DIGEST:-}
    build:
      context: ..
      dockerfile: deploy/srs/Dockerfile
      args:
        SRS_VERSION: ${BITRIVER_SRS_IMAGE_TAG:-v5.0.185}
    container_name: bitriver-srs
    restart: unless-stopped
    ports:
      - "${BITRIVER_SRS_RTMP_PORT:-1935}:1935"
    volumes:
      - ./srs/conf/srs.generated.conf:/usr/local/srs/conf/srs.conf:ro
    depends_on:
      srs-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1985/healthz || curl -fsS http://localhost:1985/api/v1/versions"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional profile to publish the SRS HTTP API (1985) to the host for debugging.
  srs-api:
    profiles:
      - srs-api
    image: alpine:3.19${BITRIVER_ALPINE_3_19_IMAGE_DIGEST:-}
    container_name: bitriver-srs-api
    command: ["sh", "-c", "sleep infinity"]
    restart: unless-stopped
    network_mode: "service:srs"
    depends_on:
      - srs
    ports:
      - "${BITRIVER_SRS_API_PORT:-1985}:1985"

  srs-config:
    image: debian:12-slim${BITRIVER_DEBIAN_IMAGE_DIGEST:-}
    container_name: bitriver-srs-config
    working_dir: /workspace
    # Render via a sanitized copy under /workspace so script path resolution still points at repo-root deploy assets.
    command: ["bash", "-lc", "mkdir -p /workspace/.tmp && tr -d '\\r' < /workspace/scripts/render-srs-config.sh > /workspace/.tmp/render-srs-config.sh && chmod +x /workspace/.tmp/render-srs-config.sh && exec /workspace/.tmp/render-srs-config.sh --env-file /workspace/.env --force"]
    volumes:
      - ..:/workspace
    env_file:
      - ../.env
    restart: "no"

  ome-config:
    build:
      context: ..
      dockerfile: deploy/ome-config/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-direct}
        GOSUMDB: ${GOSUMDB:-off}
    image: bitriver-live/ome-config:local
    working_dir: /workspace
    command: ["ome", "render", "--env-file", "/workspace/.env", "--force"]
    volumes:
      - ..:/workspace
    env_file:
      - ../.env
    restart: "no"

  ome-health-token-check:
    image: debian:12-slim${BITRIVER_DEBIAN_IMAGE_DIGEST:-}
    container_name: bitriver-ome-health-token-check
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        set -eux
        if ! ./scripts/verify-ome-health-token.sh --env-file /workspace/.env --config /workspace/deploy/ome/Server.generated.xml; then
          echo "ome-health-token-check failed: inspect '.env' token values and /workspace/deploy/ome/Server.generated.xml AccessToken before restarting bitriver-ome" >&2
          exit 1
        fi
    volumes:
      - ..:/workspace
    env_file:
      - ../.env
    depends_on:
      ome-config:
        condition: service_completed_successfully
    restart: "no"

  ome:
    image: airensoft/ovenmediaengine:${BITRIVER_OME_IMAGE_TAG:-0.16.0}${BITRIVER_OME_IMAGE_DIGEST:-}
    container_name: bitriver-ome
    hostname: ome
    restart: unless-stopped
    volumes:
      - ./ome/Server.generated.xml:/opt/ovenmediaengine/bin/origin_conf/Server.xml:ro
      - ./ome/Server.generated.xml:/opt/ovenmediaengine/bin/edge_conf/Server.xml:ro
    environment:
      BITRIVER_OME_USERNAME: ${BITRIVER_OME_USERNAME:?set via .env}
      BITRIVER_OME_PASSWORD: ${BITRIVER_OME_PASSWORD:?set via .env}
      BITRIVER_OME_ACCESS_TOKEN: ${BITRIVER_OME_ACCESS_TOKEN:-}
      BITRIVER_OME_API_TOKEN: ${BITRIVER_OME_API_TOKEN:?set via .env}
      BITRIVER_OME_HEALTHCHECK_ENABLE_LEGACY_AUTH: ${BITRIVER_OME_HEALTHCHECK_ENABLE_LEGACY_AUTH:-false}
    networks:
      default:
        aliases:
          - ome
    ports:
      - "${BITRIVER_OME_HTTP_PORT:-8081}:${BITRIVER_OME_HTTP_PORT:-8081}"
      - "${BITRIVER_OME_HTTP_TLS_PORT:-8082}:${BITRIVER_OME_HTTP_TLS_PORT:-8082}"
      - "${BITRIVER_OME_LLHLS_HOST_PORT:-${BITRIVER_OME_LLHLS_PORT:-8080}}:${BITRIVER_OME_LLHLS_PORT:-8080}"
      - "${BITRIVER_OME_LLHLS_TLS_PORT:-8443}:${BITRIVER_OME_LLHLS_TLS_PORT:-8443}"
      - "${BITRIVER_OME_SIGNALLING_PORT:-${BITRIVER_OME_SERVER_PORT:-9000}}:${BITRIVER_OME_SERVER_PORT:-9000}"
      - "${BITRIVER_OME_SERVER_TLS_PORT:-9443}:${BITRIVER_OME_SERVER_TLS_PORT:-9443}"
      - "${BITRIVER_OME_RELAY_PORT:-3478}:3478/udp"
      - "${BITRIVER_OME_RELAY_PORT:-3478}:3478/${BITRIVER_OME_RELAY_PROTOCOL:-tcp}"
      - "${BITRIVER_OME_ICE_PORT_RANGE:-10000-10009}:10000-10009/udp"
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          health_url="http://localhost:${BITRIVER_OME_HTTP_PORT:-8081}/v1/health"
          healthz_url="http://localhost:${BITRIVER_OME_HTTP_PORT:-8081}/healthz"

          token="$$BITRIVER_OME_ACCESS_TOKEN"
          # AccessToken header source: prefer BITRIVER_OME_ACCESS_TOKEN, then BITRIVER_OME_API_TOKEN.
          if [ -z "$$token" ] && [ -n "$$BITRIVER_OME_API_TOKEN" ]; then
            token="$$BITRIVER_OME_API_TOKEN"
          fi

          if [ -z "$$token" ]; then
            echo "OME healthcheck misconfigured: both BITRIVER_OME_ACCESS_TOKEN and BITRIVER_OME_API_TOKEN are empty inside the container; compare .env with 'docker compose config' output." >&2
            exit 1
          fi

          probe_with_args() {
            # Pass credentials as literal argv entries so shell metacharacters are not re-interpreted.
            curl -fsS --connect-timeout 2 --max-time 4 "$$@" "$$health_url" || curl -fsS --connect-timeout 2 --max-time 4 "$$@" "$$healthz_url"
          }

          if probe_with_args -H "AccessToken: $$token"; then
            echo "OME healthcheck succeeded with AccessToken header"
            exit 0
          fi

          attempted_modes="AccessToken header"
          echo "OME healthcheck warning: AccessToken probe failed" >&2

          # Legacy fallback modes are opt-in only for backward compatibility.
          if [ "$${BITRIVER_OME_HEALTHCHECK_ENABLE_LEGACY_AUTH:-false}" = "true" ]; then
            echo "OME healthcheck warning: legacy fallback enabled; attempting Authorization Bearer header (legacy mode)" >&2
            if probe_with_args -H "Authorization: Bearer $$token"; then
              echo "OME healthcheck succeeded with Authorization Bearer header (legacy mode)"
              exit 0
            fi
            attempted_modes="$$attempted_modes, Authorization Bearer header (legacy mode)"

            echo "OME healthcheck warning: Authorization Bearer probe failed; attempting basic auth (legacy mode)" >&2

            if [ -n "$$BITRIVER_OME_USERNAME" ] && [ -n "$$BITRIVER_OME_PASSWORD" ]; then
              if probe_with_args -u "$$BITRIVER_OME_USERNAME:$$BITRIVER_OME_PASSWORD"; then
                echo "OME healthcheck succeeded with basic auth (legacy mode)"
                exit 0
              fi
              attempted_modes="$$attempted_modes, basic auth (legacy mode)"
            else
              attempted_modes="$$attempted_modes, basic auth skipped (legacy mode; missing username/password)"
              echo "OME healthcheck skipped basic auth fallback: BITRIVER_OME_USERNAME/BITRIVER_OME_PASSWORD missing or empty" >&2
            fi
          else
            echo "OME healthcheck warning: legacy fallback disabled (set BITRIVER_OME_HEALTHCHECK_ENABLE_LEGACY_AUTH=true to enable)" >&2
          fi

          echo "OME healthcheck failed for $$health_url and $$healthz_url; attempted auth modes: $$attempted_modes" >&2
          exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      ome-health-token-check:
        condition: service_completed_successfully

  transcoder:
    image: ghcr.io/bitriver-live/bitriver-transcoder:${BITRIVER_TRANSCODER_IMAGE_TAG:?set via .env}${BITRIVER_TRANSCODER_IMAGE_DIGEST:-}
    build:
      context: ..
      dockerfile: cmd/transcoder/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-direct}
        GOSUMDB: ${GOSUMDB:-off}
    container_name: bitriver-transcoder
    restart: unless-stopped
    ports:
      - "${BITRIVER_TRANSCODER_HOST_PORT:-9001}:9000"
    environment:
      JOB_CONTROLLER_BIND: :9000
      JOB_CONTROLLER_TOKEN: ${BITRIVER_TRANSCODER_TOKEN:?set via .env}
      BITRIVER_TRANSCODER_PUBLIC_BASE_URL: ${BITRIVER_TRANSCODER_PUBLIC_BASE_URL:?set via .env}
      BITRIVER_TRANSCODER_PUBLIC_DIR: ${BITRIVER_TRANSCODER_PUBLIC_DIR:-/work/public}
      BITRIVER_TRANSCODER_RETENTION_LIVE: ${BITRIVER_TRANSCODER_RETENTION_LIVE:-}
      BITRIVER_TRANSCODER_RETENTION_UPLOADS: ${BITRIVER_TRANSCODER_RETENTION_UPLOADS:-}
    volumes:
      - ./transcoder-data:/work
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  transcoder-public:
    image: nginx:alpine${BITRIVER_NGINX_IMAGE_DIGEST:-}
    container_name: bitriver-transcoder-public
    depends_on:
      - transcoder
    restart: unless-stopped
    ports:
      - "${BITRIVER_TRANSCODER_PUBLIC_PORT:-9080}:8080"
    volumes:
      - ./transcoder-data:/work:ro
      - ./nginx/transcoder-public.conf:/etc/nginx/nginx.conf:ro

volumes:
  redis-data:
  data:
  postgres-data:
