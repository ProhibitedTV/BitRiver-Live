name: Viewer CI

on:
  push:
    branches:
      - main
    paths:
      # Viewer checks also gate backend routes/domain payload changes because
      # the web app consumes those API contracts directly.
      - 'web/viewer/**'
      - 'internal/api/**'
      - 'internal/domain/**'
      - 'internal/api/viewer_contract_test.go'
      - '.github/workflows/viewer-ci.yml'
  pull_request:
    paths:
      # Viewer checks also gate backend routes/domain payload changes because
      # the web app consumes those API contracts directly.
      - 'web/viewer/**'
      - 'internal/api/**'
      - 'internal/domain/**'
      - 'internal/api/viewer_contract_test.go'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/viewer
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Viewer integration tests
        run: npm run test:integration
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: web/viewer
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Audit dependencies
        run: npm audit --audit-level=high
        env:
          NEXT_TELEMETRY_DISABLED: 1
