name: Image vulnerability scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare Compose environment
        run: |
          cat <<'ENV' > .ci.env
          BITRIVER_LIVE_IMAGE_TAG=ci
          BITRIVER_VIEWER_IMAGE_TAG=ci
          BITRIVER_SRS_CONTROLLER_IMAGE_TAG=ci
          BITRIVER_TRANSCODER_IMAGE_TAG=ci
          BITRIVER_SRS_IMAGE_TAG=v5.0.185
          BITRIVER_OME_IMAGE_TAG=0.16.0
          BITRIVER_LIVE_ADMIN_EMAIL=ci@example.com
          BITRIVER_LIVE_ADMIN_PASSWORD=ci-admin-password
          BITRIVER_SRS_TOKEN=ci-srs-token
          BITRIVER_OME_USERNAME=ci-ome-user
          BITRIVER_OME_PASSWORD=ci-ome-password
          BITRIVER_OME_API_TOKEN=ci-ome-api-token
          BITRIVER_TRANSCODER_TOKEN=ci-transcoder-token
          BITRIVER_REDIS_PASSWORD=ci-redis-password
          BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD=ci-redis-password
          BITRIVER_POSTGRES_USER=ci-postgres
          BITRIVER_POSTGRES_PASSWORD=ci-postgres-password
          BITRIVER_TRANSCODER_PUBLIC_BASE_URL=https://example.com/hls
          ENV

      - name: Build local images from the Compose stack
        run: |
          docker compose --env-file .ci.env -f deploy/docker-compose.yml build \
            bitriver-live \
            viewer \
            srs-controller \
            transcoder \
            srs \
            ome-config

      - name: Collect Compose images
        run: |
          docker compose --env-file .ci.env -f deploy/docker-compose.yml config --images | sort -u > /tmp/compose-images.txt
          cat /tmp/compose-images.txt

      - name: Install Trivy
        run: |
          TRIVY_VERSION=0.50.1
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz
          sudo install trivy /usr/local/bin/trivy

      - name: Verify ome-config has no OS-package CVEs
        run: |
          trivy image --scanners vuln --pkg-types os --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 --no-progress bitriver-live/ome-config:local

      - name: Scan first-party images for critical vulnerabilities (blocking)
        run: |
          set -euo pipefail
          while read -r image; do
            if [ -z "$image" ]; then
              continue
            fi

            case "$image" in
              ghcr.io/bitriver-live/*|bitriver-live/*)
                echo "Scanning first-party image (blocking): $image"
                trivy image \
                  --severity CRITICAL \
                  --exit-code 1 \
                  --ignorefile .trivyignore/default.txt \
                  --no-progress \
                  "$image"
                ;;
            esac
          done < /tmp/compose-images.txt

      - name: Scan pinned third-party images for critical vulnerabilities (informational)
        run: |
          set -euo pipefail
          while read -r image; do
            if [ -z "$image" ]; then
              continue
            fi

            case "$image" in
              ghcr.io/bitriver-live/*|bitriver-live/*)
                continue
                ;;
            esac

            ignore_file=".trivyignore/default.txt"
            case "$image" in
              postgres:15-alpine*)
                ignore_file=".trivyignore/postgres-15-alpine.txt"
                ;;
            esac

            echo "Scanning third-party image (informational): $image"
            trivy image \
              --severity CRITICAL \
              --exit-code 0 \
              --ignorefile "$ignore_file" \
              --no-progress \
              "$image"
          done < /tmp/compose-images.txt
