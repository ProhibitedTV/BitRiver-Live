name: Image vulnerability scan

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  viewer-arm64:
    name: Viewer native arm64 build and runtime
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify native arm64 runner
        run: test "$(uname -m)" = "aarch64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build viewer arm64 image
        run: docker build --platform linux/arm64 --file web/viewer/Dockerfile --tag bitriver-viewer:arm64-ci web/viewer

      - name: Verify viewer arm64 runtime
        run: |
          test "$(docker image inspect bitriver-viewer:arm64-ci --format '{{.Architecture}}')" = "arm64"
          test "$(docker run --rm --entrypoint uname bitriver-viewer:arm64-ci -m)" = "aarch64"
          docker run --rm --entrypoint node bitriver-viewer:arm64-ci --version

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare Compose environment
        run: |
          cat <<'ENV' > .ci.env
          BITRIVER_LIVE_IMAGE_TAG=ci
          BITRIVER_VIEWER_IMAGE_TAG=ci
          BITRIVER_SRS_CONTROLLER_IMAGE_TAG=ci
          BITRIVER_TRANSCODER_IMAGE_TAG=ci
          BITRIVER_OME_CONFIG_IMAGE_TAG=ci
          BITRIVER_SRS_IMAGE_TAG=v5.0.185
          BITRIVER_OME_IMAGE_TAG=0.16.0
          BITRIVER_LIVE_ADMIN_EMAIL=ci@example.com
          BITRIVER_LIVE_ADMIN_PASSWORD=ci-admin-password
          BITRIVER_SRS_TOKEN=ci-srs-token
          BITRIVER_OME_USERNAME=ci-ome-user
          BITRIVER_OME_PASSWORD=ci-ome-password
          BITRIVER_OME_API_TOKEN=ci-ome-api-token
          BITRIVER_TRANSCODER_TOKEN=ci-transcoder-token
          BITRIVER_REDIS_PASSWORD=ci-redis-password
          BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD=ci-redis-password
          BITRIVER_POSTGRES_USER=ci-postgres
          BITRIVER_POSTGRES_PASSWORD=ci-postgres-password
          BITRIVER_TRANSCODER_PUBLIC_BASE_URL=https://example.com/hls
          BITRIVER_SRS_PUBLIC_RTMP_BASE_URL=rtmp://example.com/live
          BITRIVER_OME_PUBLIC_LLHLS_BASE_URL=https://example.com/live
          ENV

      - name: Build local images from the Compose stack
        run: |
          docker compose --env-file .ci.env -f deploy/docker-compose.yml build \
            bitriver-live \
            viewer \
            srs-controller \
            transcoder \
            srs \
            ome-config

      - name: Collect Compose images
        run: |
          docker compose --env-file .ci.env -f deploy/docker-compose.yml config --images | sort -u > /tmp/compose-images.txt
          cat /tmp/compose-images.txt

      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION=0.70.0
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors --output "$archive" "$url"
          test -s "$archive"
          tar -xzf "$archive" trivy
          sudo install trivy /usr/local/bin/trivy

      - name: Verify ome-config has no OS-package CVEs
        run: |
          mapfile -t ome_config_images < <(grep -E '^ghcr\.io/prohibitedtv/bitriver-ome-config:' /tmp/compose-images.txt)
          if ((${#ome_config_images[@]} != 1)); then
            printf 'Expected exactly one Compose ome-config image, found %d\n' "${#ome_config_images[@]}" >&2
            exit 1
          fi
          trivy image --scanners vuln --pkg-types os --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 --no-progress "${ome_config_images[0]}"

      - name: Scan first-party images for critical vulnerabilities (blocking)
        run: |
          set -euo pipefail
          while read -r image; do
            if [ -z "$image" ]; then
              continue
            fi

            case "$image" in
              ghcr.io/prohibitedtv/*|bitriver-live/*)
                echo "Scanning first-party image (blocking): $image"
                trivy image \
                  --severity CRITICAL \
                  --exit-code 1 \
                  --ignorefile .trivyignore/default.txt \
                  --no-progress \
                  "$image"
                ;;
            esac
          done < /tmp/compose-images.txt

      - name: Scan pinned third-party images for critical vulnerabilities (informational)
        run: |
          set -euo pipefail
          while read -r image; do
            if [ -z "$image" ]; then
              continue
            fi

            case "$image" in
              ghcr.io/prohibitedtv/*|bitriver-live/*)
                continue
                ;;
            esac

            ignore_file=".trivyignore/default.txt"
            case "$image" in
              postgres:15-alpine*)
                ignore_file=".trivyignore/postgres-15-alpine.txt"
                ;;
            esac

            echo "Scanning third-party image (informational): $image"
            trivy image \
              --severity CRITICAL \
              --exit-code 0 \
              --ignorefile "$ignore_file" \
              --no-progress \
              "$image"
          done < /tmp/compose-images.txt
