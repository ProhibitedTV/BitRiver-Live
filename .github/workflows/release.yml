name: Release

on:
  push:
    tags:
      - 'v*.*.*-*'

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write

jobs:
  verify-env:
    name: Verify production environment configuration
    runs-on: ubuntu-latest
    outputs:
      msi_version: ${{ steps.release-metadata.outputs.msi_version }}
      nfpm_version: ${{ steps.release-metadata.outputs.nfpm_version }}
      nfpm_prerelease: ${{ steps.release-metadata.outputs.nfpm_prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Derive and validate release metadata
        id: release-metadata
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/release-metadata"
          python3 ./scripts/prepare_release_candidate.py metadata \
            --tag "$GITHUB_REF_NAME" \
            --output "$metadata"
          cat "$metadata" >>"$GITHUB_OUTPUT"
          rm -f "$metadata"

      - name: Prepare job-local production validation input
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/release-validation-input"
          sentinel_file="$RUNNER_TEMP/release-secret-values"
          validation_dir="$RUNNER_TEMP/release-validation-output"
          evidence_dir="$RUNNER_TEMP/release-contract-evidence"
          dependency_evidence="$evidence_dir/release-dependencies.json"
          rm -rf "$validation_dir" "$evidence_dir"
          mkdir -p "$validation_dir" "$evidence_dir"
          image_namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          python3 ./scripts/prepare_release_candidate.py dependencies \
            --template deploy/.env.example \
            --output "$dependency_evidence" \
            --digest-attempts 12 \
            --digest-delay-seconds 10
          python3 ./scripts/prepare_release_candidate.py env \
            --tag "$GITHUB_REF_NAME" \
            --namespace "$image_namespace" \
            --template deploy/.env.example \
            --output "$env_file" \
            --sentinel-output "$sentinel_file" \
            --unpublished-first-party-digests \
            --third-party-evidence "$dependency_evidence"
          printf 'BITRIVER_RELEASE_SENTINEL_%s_%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >>"$sentinel_file"
          {
            echo "BITRIVER_RELEASE_ENV_FILE=$env_file"
            echo "BITRIVER_RELEASE_SENTINEL_FILE=$sentinel_file"
            echo "BITRIVER_RELEASE_VALIDATION_DIR=$validation_dir"
            echo "BITRIVER_RELEASE_EVIDENCE_DIR=$evidence_dir"
            echo "BITRIVER_RELEASE_IMAGE_NAMESPACE=$image_namespace"
          } >>"$GITHUB_ENV"

      - name: Validate production inputs and create redacted evidence
        run: |
          set -euo pipefail
          env_log="$BITRIVER_RELEASE_VALIDATION_DIR/environment-validation.log"
          digest_log="$BITRIVER_RELEASE_VALIDATION_DIR/image-digest-validation.log"

          set +e
          ./deploy/check-env.sh "$BITRIVER_RELEASE_ENV_FILE" >"$env_log" 2>&1
          env_status=$?
          ./scripts/require-image-digests.sh --env-file "$BITRIVER_RELEASE_ENV_FILE" >"$digest_log" 2>&1
          digest_status=$?
          set -e

          scan_status=0
          ./scripts/scan-release-evidence.sh \
            --root "$BITRIVER_RELEASE_VALIDATION_DIR" \
            --sentinel-file "$BITRIVER_RELEASE_SENTINEL_FILE" || scan_status=$?

          env_result="failed"
          digest_result="failed"
          [[ $env_status -eq 0 ]] && env_result="passed"
          [[ $digest_status -eq 0 ]] && digest_result="passed"

          cat >"$BITRIVER_RELEASE_EVIDENCE_DIR/release-contract-evidence.json" <<EOF
          {
            "schemaVersion": 1,
            "releaseTag": "$GITHUB_REF_NAME",
            "commit": "$GITHUB_SHA",
            "environmentValidation": "$env_result",
            "imageDigestValidation": "$digest_result",
            "firstPartyDigestValidation": "prepublication-format-only",
            "credentialFlow": "job-local-ephemeral",
            "imageNamespace": "$BITRIVER_RELEASE_IMAGE_NAMESPACE",
            "retainedValues": "none"
          }
          EOF

          ./scripts/scan-release-evidence.sh \
            --root "$BITRIVER_RELEASE_EVIDENCE_DIR" \
            --sentinel-file "$BITRIVER_RELEASE_SENTINEL_FILE" || scan_status=$?

          if [[ $scan_status -ne 0 ]]; then
            rm -rf "$BITRIVER_RELEASE_EVIDENCE_DIR"
            echo "Release validation output failed the secret-safety scan; unsafe details were suppressed." >&2
            exit 1
          fi
          if [[ $env_status -ne 0 || $digest_status -ne 0 ]]; then
            cat "$env_log" >&2
            cat "$digest_log" >&2
            exit 1
          fi

      - name: Remove job-local production inputs
        if: always()
        run: |
          for file in "${BITRIVER_RELEASE_ENV_FILE:-}" "${BITRIVER_RELEASE_SENTINEL_FILE:-}"; do
            [[ -n "$file" ]] && rm -f "$file"
          done
          [[ -n "${BITRIVER_RELEASE_VALIDATION_DIR:-}" ]] && rm -rf "$BITRIVER_RELEASE_VALIDATION_DIR"

      - name: Upload redacted contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-contract-evidence
          path: ${{ env.BITRIVER_RELEASE_EVIDENCE_DIR }}
          if-no-files-found: ignore
          retention-days: 3

  go-tests:
    name: Go unit tests
    needs:
      - verify-env
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: off
      GOSUMDB: off
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Verify placeholder OME config freshness
        run: |
          set -euo pipefail
          rendered="$RUNNER_TEMP/Server.generated.xml"
          go run ./cmd/bitriver ome render \
            --env-file deploy/.env.example \
            --output "$rendered" \
            --force \
            --quiet
          if ! cmp -s deploy/ome/Server.generated.xml "$rendered"; then
            echo "deploy/ome/Server.generated.xml is stale for deploy/.env.example; render and commit it before releasing." >&2
            exit 1
          fi

      - name: Run verification gate
        env:
          # verify.sh keeps host Go tests offline; Compose builds need the
          # upstream production dependency graph in clean build containers.
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: ./scripts/verify.sh

  postgres-tests:
    uses: ./.github/workflows/postgres-tests.yml

  build:
    name: Build release artifacts
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      PRODUCTION_MODFILE: ${{ github.workspace }}/go.production.mod
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Prepare upstream production module graph
        run: |
          go run ./cmd/tools/production-module --output "$PRODUCTION_MODFILE"
          go mod download -modfile="$PRODUCTION_MODFILE" all

      - name: Verify pgx mode for postgres artifacts
        env:
          GOFLAGS: -modfile=${{ github.workspace }}/go.production.mod
        run: ./scripts/check-postgres-pgx.sh postgres

      - name: Build binaries
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          targets=(
            "server"
            "transcoder"
            "tools/bootstrap-admin"
            "tools/migrate-json-to-postgres"
          )

          out_dir="dist/${GOOS}-${GOARCH}"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"
          host_goos="$(go env GOHOSTOS)"
          host_goarch="$(go env GOHOSTARCH)"

          bin_ext=""
          if [ "$GOOS" = "windows" ]; then
            bin_ext=".exe"
          fi

          bash ./scripts/stage-release-assets.sh --output "$out_dir" --release-tag "$RELEASE_TAG"

          declare -A bin_names=(
            ["server"]="bitriver-live"
          )

          declare -A build_tags=(
            ["server"]="postgres"
            ["tools/bootstrap-admin"]="postgres"
            ["tools/migrate-json-to-postgres"]="postgres"
          )

          for target in "${targets[@]}"; do
            bin_name="$(basename "$target")"
            if [[ -n ${bin_names[$target]+x} ]]; then
              bin_name="${bin_names[$target]}"
            fi

            output_path="$out_dir/$bin_name$bin_ext"
            tags="${build_tags[$target]-}"
            if [[ -n "$tags" ]]; then
              go build -modfile="$PRODUCTION_MODFILE" -tags "$tags" -o "$output_path" "./cmd/$target"
              GOOS="$host_goos" GOARCH="$host_goarch" \
                go run ./cmd/tools/verify-production-binary \
                --require-module github.com/jackc/pgx/v5 \
                "$output_path"
            else
              go build -modfile="$PRODUCTION_MODFILE" -o "$output_path" "./cmd/$target"
              GOOS="$host_goos" GOARCH="$host_goarch" \
                go run ./cmd/tools/verify-production-binary "$output_path"
            fi
          done

          if [[ "$GOOS" == "linux" && "$GOARCH" == "amd64" ]]; then
            smoke_log="$out_dir/postgres-smoke.log"
            set +e
            BITRIVER_LIVE_STORAGE_DRIVER=postgres \
              "$out_dir/bitriver-live" \
              -storage-driver postgres \
              -postgres-dsn 'postgres://bitriver:bitriver@127.0.0.1:1/bitriver?sslmode=disable' \
              >"$smoke_log" 2>&1
            smoke_status=$?
            set -e

            if grep -qi 'pgx driver stubbed in this build' "$smoke_log"; then
              echo "bitriver-live postgres smoke check detected a stubbed pgx build" >&2
              cat "$smoke_log" >&2
              exit 1
            fi
            if [[ $smoke_status -eq 0 ]]; then
              echo "bitriver-live postgres smoke check unexpectedly succeeded; expected connection failure against localhost:1" >&2
              cat "$smoke_log" >&2
              exit 1
            fi
          fi

          archive_base="bitriver-live-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            (cd "$out_dir" && zip -r "../${archive_base}.zip" .)
          else
            tar -C "$out_dir" --owner=0 --group=0 --numeric-owner -czf "dist/${archive_base}.tar.gz" .
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/bitriver-live-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error
          retention-days: 7

  build-bitriver:
    name: Build bitriver CLI binaries
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      PRODUCTION_MODFILE: ${{ github.workspace }}/go.production.mod
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Prepare upstream production module graph
        run: |
          go run ./cmd/tools/production-module --output "$PRODUCTION_MODFILE"
          go mod download -modfile="$PRODUCTION_MODFILE" all

      - name: Build bitriver binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          build_date="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          out_dir="dist/bitriver-${GOOS}-${GOARCH}"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"
          host_goos="$(go env GOHOSTOS)"
          host_goarch="$(go env GOHOSTARCH)"

          bin_ext=""
          archive_ext="tar.gz"
          if [ "$GOOS" = "windows" ]; then
            bin_ext=".exe"
            archive_ext="zip"
          fi

          ldflags=(
            "-X" "main.version=${RELEASE_TAG}"
            "-X" "main.commit=${COMMIT_SHA}"
            "-X" "main.date=${build_date}"
          )

          go build -modfile="$PRODUCTION_MODFILE" -trimpath -ldflags "${ldflags[*]}" -o "$out_dir/bitriver${bin_ext}" ./cmd/bitriver
          GOOS="$host_goos" GOARCH="$host_goarch" \
            go run ./cmd/tools/verify-production-binary "$out_dir/bitriver${bin_ext}"

          if [ "$archive_ext" = "zip" ]; then
            (cd dist && zip -r "bitriver-${GOOS}-${GOARCH}.zip" "bitriver-${GOOS}-${GOARCH}")
          else
            tar -C dist -czf "dist/bitriver-${GOOS}-${GOARCH}.tar.gz" "bitriver-${GOOS}-${GOARCH}"
          fi

      - name: Upload bitriver binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitriver-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/bitriver-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error
          retention-days: 7

  build-launcher:
    name: Build launcher bundles and signatures
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      COSIGN_EXPERIMENTAL: "true"
      PRODUCTION_MODFILE: ${{ github.workspace }}/go.production.mod
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Prepare upstream production module graph
        run: |
          go run ./cmd/tools/production-module --output "$PRODUCTION_MODFILE"
          go mod download -modfile="$PRODUCTION_MODFILE" all

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build launcher bundle
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.ref_name }}
          NFPM_VERSION: ${{ needs.verify-env.outputs.nfpm_version }}
          NFPM_PRERELEASE: ${{ needs.verify-env.outputs.nfpm_prerelease }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          build_date="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          launcher_root="dist/bitriver-launcher-${GOOS}-${GOARCH}"
          rm -rf "$launcher_root"
          mkdir -p "$launcher_root/bin" "$launcher_root/share/deploy"
          bash ./scripts/stage-release-assets.sh --output "$launcher_root/share/bitriver-live" --release-tag "$RELEASE_TAG"
          host_goos="$(go env GOHOSTOS)"
          host_goarch="$(go env GOHOSTARCH)"

          bin_ext=""
          archive_ext="tar.gz"
          if [ "$GOOS" = "windows" ]; then
            bin_ext=".exe"
            archive_ext="zip"
          fi

          ldflags=(
            "-X" "main.version=${RELEASE_TAG}"
            "-X" "main.commit=${COMMIT_SHA}"
            "-X" "main.date=${build_date}"
          )

          go build -modfile="$PRODUCTION_MODFILE" -trimpath -ldflags "${ldflags[*]}" -o "$launcher_root/bin/bitriver${bin_ext}" ./cmd/bitriver
          GOOS="$host_goos" GOARCH="$host_goarch" \
            go run ./cmd/tools/verify-production-binary "$launcher_root/bin/bitriver${bin_ext}"
          if [ "$GOOS" = "windows" ]; then
            cp scripts/bitriver-live-wrapper.ps1 "$launcher_root/bin/bitriver-live.ps1"
            chmod +x "$launcher_root/bin/bitriver${bin_ext}"
          else
            cp scripts/bitriver-live-wrapper.sh "$launcher_root/bin/bitriver-live"
            cp deploy/install/compose-host.sh "$launcher_root/install.sh"
            chmod +x "$launcher_root/install.sh" "$launcher_root/bin/bitriver-live" "$launcher_root/bin/bitriver${bin_ext}"
          fi

          cosign sign-blob --yes \
            --bundle "$launcher_root/bin/bitriver${bin_ext}.sigstore.json" \
            "$launcher_root/bin/bitriver${bin_ext}"

          if [ "$archive_ext" = "zip" ]; then
            (cd dist && zip -r "bitriver-launcher-${GOOS}-${GOARCH}.zip" "bitriver-launcher-${GOOS}-${GOARCH}")
          else
            tar -C dist -czf "dist/bitriver-launcher-${GOOS}-${GOARCH}.tar.gz" "bitriver-launcher-${GOOS}-${GOARCH}"
          fi

          if [ "$GOOS" = "linux" ]; then
            host_tools="$RUNNER_TEMP/bitriver-host-tools"
            mkdir -p "$host_tools"
            GOOS="$host_goos" GOARCH="$host_goarch" GOBIN="$host_tools" \
              go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
            nfpm="$host_tools/nfpm"
            test -x "$nfpm"
            workspace="$PWD"
            launcher_root_abs="$(cd "$launcher_root" && pwd -P)"
            (
              cd "$launcher_root_abs"
              NFPM_ARCH="$GOARCH" NFPM_VERSION="$NFPM_VERSION" NFPM_PRERELEASE="$NFPM_PRERELEASE" LAUNCHER_ROOT="$launcher_root_abs" \
                GOMAXPROCS=2 "$nfpm" pkg --packager deb --config "$workspace/deploy/installers/nfpm.yaml" --target "$workspace/dist/bitriver-live_${RELEASE_TAG}_${GOARCH}.deb"
              NFPM_ARCH="$GOARCH" NFPM_VERSION="$NFPM_VERSION" NFPM_PRERELEASE="$NFPM_PRERELEASE" LAUNCHER_ROOT="$launcher_root_abs" \
                GOMAXPROCS=2 "$nfpm" pkg --packager rpm --config "$workspace/deploy/installers/nfpm.yaml" --target "$workspace/dist/bitriver-live_${RELEASE_TAG}_${GOARCH}.rpm"
            )
          fi

      - name: Upload launcher archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/bitriver-launcher-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux installer packages
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-linux-packages-${{ matrix.goarch }}
          path: |
            dist/bitriver-live_${{ github.ref_name }}_${{ matrix.goarch }}.deb
            dist/bitriver-live_${{ github.ref_name }}_${{ matrix.goarch }}.rpm
          if-no-files-found: error
          retention-days: 7

  build-viewer:
    name: Build viewer bundle
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/viewer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/viewer/package-lock.json

      - name: Install dependencies
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm ci

      - name: Audit production and build dependencies
        run: npm audit --audit-level=high

      - name: Lint
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run lint

      - name: Install Playwright browsers
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npx playwright install --with-deps

      - name: Test
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run test:integration

      - name: Cache Next.js build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/viewer/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('web/viewer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Build viewer
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Package viewer bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact_root="$GITHUB_WORKSPACE/dist"
          bundle_root="$artifact_root/bitriver-viewer"
          rm -rf "$bundle_root"
          mkdir -p "$bundle_root"
          cp -R .next "$bundle_root/.next"
          rm -rf "$bundle_root/.next/cache"
          if [ -d public ]; then
            cp -R public "$bundle_root/public"
          fi
          cp package.json package-lock.json next.config.js "$bundle_root/"
          tar -C "$artifact_root" -czf "$artifact_root/bitriver-viewer-${RELEASE_TAG}.tar.gz" bitriver-viewer
          rm -rf "$bundle_root"

      - name: Upload viewer bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewer-bundle
          path: ${{ github.workspace }}/dist/bitriver-viewer-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  package-acceptance:
    name: Package acceptance (${{ matrix.name }})
    needs:
      - build-launcher
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 deb
            image: ubuntu:24.04
            format: deb
          - name: Debian 12 deb
            image: debian:12
            format: deb
          - name: Rocky Linux 9 rpm
            image: rockylinux:9
            format: rpm
    steps:
      - name: Download amd64 Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: launcher-linux-packages-amd64
          path: packages

      - name: Install, inspect, and remove package without deleting data
        env:
          TEST_IMAGE: ${{ matrix.image }}
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          docker run --rm \
            --mount "type=bind,source=$PWD/packages,target=/packages,readonly" \
            -e PACKAGE_FORMAT \
            "$TEST_IMAGE" \
            bash -euc '
              case "$PACKAGE_FORMAT" in
                deb)
                  package=$(find /packages -maxdepth 1 -name "*.deb" -print -quit)
                  dpkg -i "$package"
                  ;;
                rpm)
                  package=$(find /packages -maxdepth 1 -name "*.rpm" -print -quit)
                  rpm -i "$package"
                  ;;
                *) exit 2 ;;
              esac

              test -x /usr/local/bin/bitriver
              test -x /usr/local/bin/bitriver-live
              test -x /usr/local/sbin/bitriver-host
              test -f /usr/local/share/bitriver-live/deploy/docker-compose.yml
              test -f /usr/local/share/bitriver-live/deploy/postgres-migrate.sh
              test -f /usr/local/share/bitriver-live/deploy/ome/Server.xml
              test -f /usr/local/share/bitriver-live/deploy/systemd/bitriver-live-compose.service
              test ! -e /usr/local/share/bitriver-live/deploy/ome/Server.generated.xml

              mkdir -p /etc/bitriver-live /var/lib/bitriver-live
              touch /etc/bitriver-live/operator-config /var/lib/bitriver-live/operator-data
              if [ "$PACKAGE_FORMAT" = deb ]; then
                dpkg -r bitriver-live
              else
                rpm -e bitriver-live
              fi
              test -f /etc/bitriver-live/operator-config
              test -f /var/lib/bitriver-live/operator-data
            '

  publish-images:
    name: Publish container images
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - component: api
            context: .
            dockerfile: Dockerfile
            image_name: bitriver-live
          - component: srs-controller
            context: .
            dockerfile: cmd/srs-controller/Dockerfile
            image_name: bitriver-srs-controller
          - component: transcoder
            context: .
            dockerfile: cmd/transcoder/Dockerfile
            image_name: bitriver-transcoder
          - component: ome-config
            context: .
            dockerfile: deploy/ome-config/Dockerfile
            image_name: bitriver-ome-config
    env:
      REGISTRY: ghcr.io
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select repository-owner image namespace
        id: image-namespace
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          tags: |
            ${{ steps.image-namespace.outputs.value }}/${{ matrix.image_name }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Sign and verify ${{ matrix.component }} image digest
        env:
          IMAGE_NAMESPACE: ${{ steps.image-namespace.outputs.value }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.image_name }}
        run: |
          set -euo pipefail
          image_ref="$IMAGE_NAMESPACE/$IMAGE_NAME@$IMAGE_DIGEST"
          bundle="$IMAGE_NAME-$RELEASE_TAG.image.sigstore.json"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign --yes --bundle "$bundle" "$image_ref"
          cosign verify "$image_ref" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            >"$RUNNER_TEMP/$IMAGE_NAME-image-verification.json"

      - name: Generate SBOM for ${{ matrix.component }} image
        id: sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image-namespace.outputs.value }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
          output-file: ${{ matrix.image_name }}-${{ env.RELEASE_TAG }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom-${{ matrix.component }}
          path: ${{ matrix.image_name }}-${{ env.RELEASE_TAG }}.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload image signature bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-signature-${{ matrix.component }}
          path: ${{ matrix.image_name }}-${{ env.RELEASE_TAG }}.image.sigstore.json
          if-no-files-found: error
          retention-days: 7

  publish-viewer-architectures:
    name: Publish viewer image (${{ matrix.arch }})
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY: ghcr.io
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select repository-owner image namespace
        id: image-namespace
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_OUTPUT"

      - name: Verify native runner architecture
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            amd64) expected=x86_64 ;;
            arm64) expected=aarch64 ;;
            *) exit 2 ;;
          esac
          actual="$(uname -m)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Runner architecture mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push viewer ${{ matrix.arch }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: web/viewer
          file: web/viewer/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image-namespace.outputs.value }}/bitriver-viewer:${{ env.RELEASE_TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Verify pushed viewer architecture
        run: |
          set -euo pipefail
          image="${{ steps.image-namespace.outputs.value }}/bitriver-viewer:${RELEASE_TAG}-${{ matrix.arch }}"
          case "${{ matrix.arch }}" in
            amd64) expected=x86_64 ;;
            arm64) expected=aarch64 ;;
            *) exit 2 ;;
          esac
          docker pull "$image"
          actual="$(docker run --rm --entrypoint uname "$image" -m)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Viewer image architecture mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          docker run --rm --entrypoint node "$image" --version

  publish-viewer-image:
    name: Publish viewer multi-architecture manifest
    needs:
      - verify-env
      - publish-viewer-architectures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGISTRY: ghcr.io
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Select repository-owner image namespace
        id: image-namespace
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Assemble viewer manifest
        id: manifest
        run: |
          set -euo pipefail
          image="${{ steps.image-namespace.outputs.value }}/bitriver-viewer"
          release_ref="$image:$RELEASE_TAG"
          docker buildx imagetools create \
            --tag "$release_ref" \
            "$release_ref-amd64" \
            "$release_ref-arm64"
          digest="$(docker buildx imagetools inspect "$release_ref" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid viewer manifest digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Sign and verify viewer image digest
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          image="${{ steps.image-namespace.outputs.value }}/bitriver-viewer"
          image_ref="$image@$IMAGE_DIGEST"
          bundle="bitriver-viewer-$RELEASE_TAG.image.sigstore.json"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign --yes --bundle "$bundle" "$image_ref"
          cosign verify "$image_ref" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            >"$RUNNER_TEMP/bitriver-viewer-image-verification.json"

      - name: Generate SBOM for viewer image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image-namespace.outputs.value }}/bitriver-viewer@${{ steps.manifest.outputs.digest }}
          output-file: bitriver-viewer-${{ env.RELEASE_TAG }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom-viewer
          path: bitriver-viewer-${{ env.RELEASE_TAG }}.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload image signature bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-signature-viewer
          path: bitriver-viewer-${{ env.RELEASE_TAG }}.image.sigstore.json
          if-no-files-found: error
          retention-days: 7

  pull-only-product-gate:
    name: Pull-only tagged product gate
    needs:
      - verify-env
      - publish-images
      - publish-viewer-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Download verified release dependency evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-contract-evidence
          path: ${{ runner.temp }}/release-contract-evidence

      - name: Prepare anonymous image and production environment evidence
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/release-product-evidence"
          env_file="$RUNNER_TEMP/release-product.env"
          sentinel_file="$RUNNER_TEMP/release-product.sentinels"
          image_evidence="$evidence_dir/release-images.json"
          dependency_evidence="$RUNNER_TEMP/release-contract-evidence/release-dependencies.json"
          image_namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"

          docker logout ghcr.io >/dev/null 2>&1 || true
          python3 ./scripts/prepare_release_candidate.py images \
            --tag "$GITHUB_REF_NAME" \
            --namespace "$image_namespace" \
            --output "$image_evidence" \
            --digest-attempts 12 \
            --digest-delay-seconds 10
          python3 ./scripts/prepare_release_candidate.py env \
            --tag "$GITHUB_REF_NAME" \
            --namespace "$image_namespace" \
            --template deploy/.env.example \
            --output "$env_file" \
            --sentinel-output "$sentinel_file" \
            --first-party-evidence "$image_evidence" \
            --third-party-evidence "$dependency_evidence" \
            --product-loopback
          {
            echo "BITRIVER_RELEASE_PRODUCT_EVIDENCE=$evidence_dir"
            echo "BITRIVER_RELEASE_PRODUCT_ENV=$env_file"
            echo "BITRIVER_RELEASE_PRODUCT_SENTINELS=$sentinel_file"
          } >>"$GITHUB_ENV"

      - name: Verify immutable first-party image signatures
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          jq -r --arg tag "$GITHUB_REF_NAME" \
            '.images[] | "\(.reference | sub((":" + $tag + "$"); ""))@\(.digest)"' \
            "$BITRIVER_RELEASE_PRODUCT_EVIDENCE/release-images.json" |
            while IFS= read -r image_ref; do
              cosign verify "$image_ref" \
                --certificate-identity "$identity" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                >/dev/null
            done

      - name: Run tagged production golden path
        env:
          BITRIVER_SMOKE_ENV_FILE: ${{ env.BITRIVER_RELEASE_PRODUCT_ENV }}
          BITRIVER_SMOKE_IMAGE_SOURCE: pull
          BITRIVER_SMOKE_LIVE_MODE: production
        run: |
          set -euo pipefail
          ./scripts/test-production-golden-path.sh \
            --stack quickstart \
            --client docker \
            --artifact-dir "$BITRIVER_RELEASE_PRODUCT_EVIDENCE"
          ./scripts/scan-release-evidence.sh \
            --root "$BITRIVER_RELEASE_PRODUCT_EVIDENCE" \
            --sentinel-file "$BITRIVER_RELEASE_PRODUCT_SENTINELS"

      - name: Remove job-local product inputs
        if: always()
        run: |
          rm -f \
            "${BITRIVER_RELEASE_PRODUCT_ENV:-}" \
            "${BITRIVER_RELEASE_PRODUCT_SENTINELS:-}"

      - name: Upload pull-only product evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-product-evidence
          path: |
            ${{ env.BITRIVER_RELEASE_PRODUCT_EVIDENCE }}/release-images.json
            ${{ env.BITRIVER_RELEASE_PRODUCT_EVIDENCE }}/production-golden-path.json
          if-no-files-found: warn
          retention-days: 14

  brew-formula:
    name: Generate Homebrew formula
    needs:
      - build-launcher
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download macOS launcher artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: launcher-darwin-*
          path: dist
          merge-multiple: true

      - name: Generate formula
        env:
          VERSION: ${{ github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          set -euo pipefail
          arm_tar="dist/bitriver-launcher-darwin-arm64.tar.gz"
          amd_tar="dist/bitriver-launcher-darwin-amd64.tar.gz"
          arm_sha="$(sha256sum "$arm_tar" | awk '{print $1}')"
          amd_sha="$(sha256sum "$amd_tar" | awk '{print $1}')"
          arm_url="$REPO_URL/$(basename "$arm_tar")"
          amd_url="$REPO_URL/$(basename "$amd_tar")"
          mkdir -p dist/formula
          scripts/generate-brew-formula.sh "$VERSION" "$arm_url" "$arm_sha" "$amd_url" "$amd_sha" dist/formula/bitriver-live.rb

      - name: Upload formula artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: dist/formula/bitriver-live.rb
          if-no-files-found: error
          retention-days: 7

  windows-msi:
    name: Build Windows MSI installer
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      PRODUCTION_MODFILE: ${{ github.workspace }}\go.production.mod
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Prepare upstream production module graph
        shell: pwsh
        run: |
          go run ./cmd/tools/production-module --output $env:PRODUCTION_MODFILE
          $modFileArg = "-modfile=$($env:PRODUCTION_MODFILE)"
          go mod download $modFileArg all

      - name: Stage canonical Windows release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          launcher_root="$(cygpath -u "$RUNNER_TEMP")/bitriver-launcher-windows-amd64"
          rm -rf "$launcher_root"
          mkdir -p "$launcher_root/bin"
          bash ./scripts/stage-release-assets.sh \
            --output "$launcher_root/share/bitriver-live" \
            --release-tag "$RELEASE_TAG"
          echo "BITRIVER_WINDOWS_LAUNCHER_ROOT=$(cygpath -w "$launcher_root")" >>"$GITHUB_ENV"

      - name: Install pinned WiX Toolset
        shell: pwsh
        env:
          WIX_ARCHIVE_SHA256: 6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          $wixRoot = Join-Path $env:RUNNER_TEMP "wix314"
          Invoke-WebRequest `
            -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" `
            -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WIX_ARCHIVE_SHA256) {
            throw "WiX archive checksum mismatch: expected $($env:WIX_ARCHIVE_SHA256), got $actualHash"
          }
          if (Test-Path -LiteralPath $wixRoot) {
            Remove-Item -Recurse -Force -LiteralPath $wixRoot
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $wixRoot
          foreach ($tool in @("heat.exe", "candle.exe", "light.exe", "WixUIExtension.dll")) {
            $toolPath = Join-Path $wixRoot $tool
            if (-not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
              throw "Pinned WiX archive is missing $tool"
            }
          }
          "BITRIVER_WIX_ROOT=$wixRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MSI_VERSION: ${{ needs.verify-env.outputs.msi_version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $buildDate = (Get-Date).ToUniversalTime().ToString("s") + "Z"
          $launcherRoot = $env:BITRIVER_WINDOWS_LAUNCHER_ROOT
          $releaseAssetsRoot = Join-Path $launcherRoot "share\bitriver-live"

          $ldflags = "-X main.version=$env:RELEASE_TAG -X main.commit=$env:COMMIT_SHA -X main.date=$buildDate"
          $binaryPath = Join-Path $launcherRoot "bin/bitriver.exe"
          $modFileArg = "-modfile=$($env:PRODUCTION_MODFILE)"
          go build $modFileArg -trimpath -ldflags $ldflags -o $binaryPath ./cmd/bitriver
          go run ./cmd/tools/verify-production-binary $binaryPath
          Copy-Item scripts/bitriver-live-wrapper.ps1 (Join-Path $launcherRoot "bin/bitriver-live.ps1")

          $distDir = Join-Path (Get-Location) "dist"
          if (-not (Test-Path $distDir)) { New-Item -ItemType Directory -Path $distDir | Out-Null }
          $wixRoot = $env:BITRIVER_WIX_ROOT
          $heat = Join-Path $wixRoot "heat.exe"
          $candle = Join-Path $wixRoot "candle.exe"
          $light = Join-Path $wixRoot "light.exe"
          $wixUIExtension = Join-Path $wixRoot "WixUIExtension.dll"
          $harvest = Join-Path $env:RUNNER_TEMP "bitriver-release-assets.wxs"
          $productVersionArg = "-dProductVersion=$($env:MSI_VERSION)"
          $sourceDirArg = "-dSourceDir=$launcherRoot"
          $releaseAssetsDirArg = "-dReleaseAssetsDir=$releaseAssetsRoot"
          & $heat dir $releaseAssetsRoot -nologo -cg ReleaseAssets -dr RELEASEASSETSDIR -srd -sreg -ag -var var.ReleaseAssetsDir -out $harvest
          & $candle -nologo $productVersionArg $sourceDirArg $releaseAssetsDirArg deploy/installers/bitriver-live.wxs $harvest
          & $light -nologo -ext $wixUIExtension bitriver-live.wixobj bitriver-release-assets.wixobj -o (Join-Path $distDir "bitriver-live-$($env:RELEASE_TAG).msi")

      - name: Upload MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: dist/bitriver-live-${{ github.ref_name }}.msi
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs:
      - go-tests
      - postgres-tests
      - verify-env
      - build
      - build-bitriver
      - build-launcher
      - package-acceptance
      - build-viewer
      - publish-images
      - publish-viewer-image
      - pull-only-product-gate
      - brew-formula
      - windows-msi
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          pattern: "!*.dockerbuild"

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          copy_unique() {
            local source="$1"
            local target="dist/$(basename "$source")"
            if [[ -e "$target" ]]; then
              echo "Duplicate release asset name: $(basename "$source")" >&2
              exit 1
            fi
            cp "$source" "$target"
          }
          while IFS= read -r -d '' file; do
            copy_unique "$file"
          done < <(
            find release -type f \( \
              -name '*.tar.gz' -o \
              -name '*.zip' -o \
              -name '*.spdx.json' -o \
              -name '*.image.sigstore.json' -o \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.msi' -o \
              -name '*.rb' \
            \) -print0
          )
          for evidence in \
            release-contract-evidence.json \
            release-dependencies.json \
            release-images.json \
            production-golden-path.json; do
            mapfile -d '' matches < <(find release -type f -name "$evidence" -print0)
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "Expected exactly one $evidence, found ${#matches[@]}" >&2
              exit 1
            fi
            copy_unique "${matches[0]}"
          done

      - name: Scan and inventory release payload
        timeout-minutes: 10
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/release-publication-evidence"
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"

          ./scripts/scan-release-evidence.sh \
            --root release \
            --inventory "$evidence_dir/artifact-inventory.tsv"
          ./scripts/scan-release-evidence.sh --root dist

          cat >"$evidence_dir/release-scan-status.json" <<EOF
          {
            "schemaVersion": 1,
            "releaseTag": "$GITHUB_REF_NAME",
            "commit": "$GITHUB_SHA",
            "downloadedArtifactScan": "passed",
            "publicationPayloadScan": "passed"
          }
          EOF
          ./scripts/scan-release-evidence.sh --root "$evidence_dir"
          cp "$evidence_dir/release-scan-status.json" dist/release-scan-status.json
          echo "BITRIVER_RELEASE_PUBLICATION_EVIDENCE=$evidence_dir" >>"$GITHUB_ENV"

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Create and sign immutable candidate release set
        run: |
          set -euo pipefail
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go_version="go$(tr -d '\r\n' < .go-version)"
          node_version="v$(tr -d '\r\n' < web/viewer/.nvmrc)"
          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"

          python3 ./scripts/release_set.py candidate \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-url "$workflow_url" \
            --created-at "$created_at" \
            --go-version "$go_version" \
            --node-version "$node_version" \
            --cosign-version v3.1.2 \
            --assets-dir dist \
            --output dist/release-set.json \
            --markdown-output dist/release-set.md
          cosign sign-blob --yes \
            --bundle dist/release-set.sigstore.json \
            dist/release-set.json
          cosign verify-blob \
            --bundle dist/release-set.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/release-set.json
          python3 ./scripts/release_set.py checksums \
            --assets-dir dist \
            --output dist/CHECKSUMS.txt
          python3 ./scripts/release_set.py verify-candidate \
            --assets-dir dist \
            --manifest dist/release-set.json \
            --expected-tag "$GITHUB_REF_NAME" \
            --expected-commit "$GITHUB_SHA"
          ./scripts/scan-release-evidence.sh \
            --root dist \
            --inventory "$BITRIVER_RELEASE_PUBLICATION_EVIDENCE/artifact-inventory.tsv"

      - name: Upload release publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication-evidence
          path: ${{ env.BITRIVER_RELEASE_PUBLICATION_EVIDENCE }}
          if-no-files-found: error
          retention-days: 3

      - name: Generate release notes
        id: notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const result = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
            });
            const notesPath = path.join(process.env.RUNNER_TEMP, 'bitriver-release-notes.md');
            fs.writeFileSync(notesPath, result.data.body, { encoding: 'utf8', mode: 0o600 });
            core.setOutput('path', notesPath);

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
