name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write

jobs:
  verify-env:
    name: Verify production environment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache: true

      - name: Prepare job-local production validation input
        env:
          BITRIVER_LIVE_MODE: production
          BITRIVER_DEPLOY_IMAGE_SOURCE: pull
          BITRIVER_POSTGRES_USER: ${{ secrets.BITRIVER_POSTGRES_USER }}
          BITRIVER_POSTGRES_PASSWORD: ${{ secrets.BITRIVER_POSTGRES_PASSWORD }}
          BITRIVER_REDIS_PASSWORD: ${{ secrets.BITRIVER_REDIS_PASSWORD }}
          BITRIVER_OME_API: ${{ secrets.BITRIVER_OME_API }}
          BITRIVER_LIVE_ADMIN_EMAIL: ${{ secrets.BITRIVER_LIVE_ADMIN_EMAIL }}
          BITRIVER_LIVE_ADMIN_PASSWORD: ${{ secrets.BITRIVER_LIVE_ADMIN_PASSWORD }}
          BITRIVER_LIVE_SESSION_TTL: ${{ secrets.BITRIVER_LIVE_SESSION_TTL }}
          BITRIVER_LIVE_ALLOW_SELF_SIGNUP: ${{ secrets.BITRIVER_LIVE_ALLOW_SELF_SIGNUP }}
          BITRIVER_LIVE_METRICS_TOKEN: ${{ secrets.BITRIVER_LIVE_METRICS_TOKEN }}
          BITRIVER_LIVE_RATE_LOGIN_LIMIT: ${{ secrets.BITRIVER_LIVE_RATE_LOGIN_LIMIT }}
          BITRIVER_LIVE_RATE_LOGIN_WINDOW: ${{ secrets.BITRIVER_LIVE_RATE_LOGIN_WINDOW }}
          BITRIVER_SRS_TOKEN: ${{ secrets.BITRIVER_SRS_TOKEN }}
          BITRIVER_OME_USERNAME: ${{ secrets.BITRIVER_OME_USERNAME }}
          BITRIVER_OME_PASSWORD: ${{ secrets.BITRIVER_OME_PASSWORD }}
          BITRIVER_OME_API_TOKEN: ${{ secrets.BITRIVER_OME_API_TOKEN }}
          BITRIVER_OME_ACCESS_TOKEN: ${{ secrets.BITRIVER_OME_ACCESS_TOKEN }}
          BITRIVER_OME_BIND: ${{ secrets.BITRIVER_OME_BIND }}
          BITRIVER_OME_IP: ${{ secrets.BITRIVER_OME_IP }}
          BITRIVER_OME_SERVER_PORT: ${{ secrets.BITRIVER_OME_SERVER_PORT }}
          BITRIVER_OME_SERVER_TLS_PORT: ${{ secrets.BITRIVER_OME_SERVER_TLS_PORT }}
          BITRIVER_TRANSCODER_TOKEN: ${{ secrets.BITRIVER_TRANSCODER_TOKEN }}
          BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD: ${{ secrets.BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD }}
          BITRIVER_TRANSCODER_PUBLIC_BASE_URL: ${{ secrets.BITRIVER_TRANSCODER_PUBLIC_BASE_URL }}
          BITRIVER_SRS_PUBLIC_RTMP_BASE_URL: ${{ secrets.BITRIVER_SRS_PUBLIC_RTMP_BASE_URL }}
          BITRIVER_OME_PUBLIC_LLHLS_BASE_URL: ${{ secrets.BITRIVER_OME_PUBLIC_LLHLS_BASE_URL }}
          BITRIVER_LIVE_IMAGE_TAG: ${{ secrets.BITRIVER_LIVE_IMAGE_TAG }}
          BITRIVER_VIEWER_IMAGE_TAG: ${{ secrets.BITRIVER_VIEWER_IMAGE_TAG }}
          BITRIVER_SRS_CONTROLLER_IMAGE_TAG: ${{ secrets.BITRIVER_SRS_CONTROLLER_IMAGE_TAG }}
          BITRIVER_TRANSCODER_IMAGE_TAG: ${{ secrets.BITRIVER_TRANSCODER_IMAGE_TAG }}
          BITRIVER_SRS_IMAGE_TAG: ${{ secrets.BITRIVER_SRS_IMAGE_TAG }}
          BITRIVER_OME_IMAGE_TAG: ${{ secrets.BITRIVER_OME_IMAGE_TAG }}
          BITRIVER_REDIS_IMAGE_DIGEST: ${{ secrets.BITRIVER_REDIS_IMAGE_DIGEST }}
          BITRIVER_POSTGRES_IMAGE_DIGEST: ${{ secrets.BITRIVER_POSTGRES_IMAGE_DIGEST }}
          BITRIVER_SRS_IMAGE_DIGEST: ${{ secrets.BITRIVER_SRS_IMAGE_DIGEST }}
          BITRIVER_OME_IMAGE_DIGEST: ${{ secrets.BITRIVER_OME_IMAGE_DIGEST }}
          BITRIVER_NGINX_IMAGE_DIGEST: ${{ secrets.BITRIVER_NGINX_IMAGE_DIGEST }}
          BITRIVER_ALPINE_3_IMAGE_DIGEST: ${{ secrets.BITRIVER_ALPINE_3_IMAGE_DIGEST }}
          BITRIVER_ALPINE_3_19_IMAGE_DIGEST: ${{ secrets.BITRIVER_ALPINE_3_19_IMAGE_DIGEST }}
          BITRIVER_DEBIAN_IMAGE_DIGEST: ${{ secrets.BITRIVER_DEBIAN_IMAGE_DIGEST }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_VIEWER_URL: ${{ secrets.NEXT_PUBLIC_VIEWER_URL }}
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/release-validation-input"
          sentinel_file="$RUNNER_TEMP/release-secret-values"
          validation_dir="$RUNNER_TEMP/release-validation-output"
          evidence_dir="$RUNNER_TEMP/release-contract-evidence"
          rm -rf "$validation_dir" "$evidence_dir"
          mkdir -p "$validation_dir" "$evidence_dir"
          : >"$env_file"
          : >"$sentinel_file"
          chmod 600 "$env_file" "$sentinel_file"
          vars=(
            BITRIVER_LIVE_MODE
            BITRIVER_DEPLOY_IMAGE_SOURCE
            BITRIVER_POSTGRES_USER
            BITRIVER_POSTGRES_PASSWORD
            BITRIVER_REDIS_PASSWORD
            BITRIVER_OME_API
            BITRIVER_LIVE_ADMIN_EMAIL
            BITRIVER_LIVE_ADMIN_PASSWORD
            BITRIVER_LIVE_SESSION_TTL
            BITRIVER_LIVE_ALLOW_SELF_SIGNUP
            BITRIVER_LIVE_METRICS_TOKEN
            BITRIVER_LIVE_RATE_LOGIN_LIMIT
            BITRIVER_LIVE_RATE_LOGIN_WINDOW
            BITRIVER_SRS_TOKEN
            BITRIVER_OME_USERNAME
            BITRIVER_OME_PASSWORD
            BITRIVER_OME_API_TOKEN
            BITRIVER_OME_ACCESS_TOKEN
            BITRIVER_OME_BIND
            BITRIVER_OME_IP
            BITRIVER_OME_SERVER_PORT
            BITRIVER_OME_SERVER_TLS_PORT
            BITRIVER_TRANSCODER_TOKEN
            BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD
            BITRIVER_TRANSCODER_PUBLIC_BASE_URL
            BITRIVER_SRS_PUBLIC_RTMP_BASE_URL
            BITRIVER_OME_PUBLIC_LLHLS_BASE_URL
            BITRIVER_LIVE_IMAGE_TAG
            BITRIVER_VIEWER_IMAGE_TAG
            BITRIVER_SRS_CONTROLLER_IMAGE_TAG
            BITRIVER_TRANSCODER_IMAGE_TAG
            BITRIVER_SRS_IMAGE_TAG
            BITRIVER_OME_IMAGE_TAG
            BITRIVER_REDIS_IMAGE_DIGEST
            BITRIVER_POSTGRES_IMAGE_DIGEST
            BITRIVER_SRS_IMAGE_DIGEST
            BITRIVER_OME_IMAGE_DIGEST
            BITRIVER_NGINX_IMAGE_DIGEST
            BITRIVER_ALPINE_3_IMAGE_DIGEST
            BITRIVER_ALPINE_3_19_IMAGE_DIGEST
            BITRIVER_DEBIAN_IMAGE_DIGEST
            NEXT_PUBLIC_API_BASE_URL
            NEXT_PUBLIC_VIEWER_URL
          )
          secret_vars=(
            BITRIVER_POSTGRES_PASSWORD
            BITRIVER_REDIS_PASSWORD
            BITRIVER_LIVE_ADMIN_PASSWORD
            BITRIVER_LIVE_METRICS_TOKEN
            BITRIVER_SRS_TOKEN
            BITRIVER_OME_PASSWORD
            BITRIVER_OME_API_TOKEN
            BITRIVER_OME_ACCESS_TOKEN
            BITRIVER_TRANSCODER_TOKEN
            BITRIVER_LIVE_CHAT_QUEUE_REDIS_PASSWORD
          )
          for var in "${vars[@]}"; do
            value="${!var-}"
            printf '%s=%q\n' "$var" "$value" >>"$env_file"
          done
          for var in "${secret_vars[@]}"; do
            value="${!var-}"
            if [[ -n "$value" ]]; then
              printf '%s\n' "$value" >>"$sentinel_file"
            fi
          done
          printf 'BITRIVER_RELEASE_SENTINEL_%s_%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >>"$sentinel_file"
          {
            echo "BITRIVER_RELEASE_ENV_FILE=$env_file"
            echo "BITRIVER_RELEASE_SENTINEL_FILE=$sentinel_file"
            echo "BITRIVER_RELEASE_VALIDATION_DIR=$validation_dir"
            echo "BITRIVER_RELEASE_EVIDENCE_DIR=$evidence_dir"
          } >>"$GITHUB_ENV"

      - name: Validate production inputs and create redacted evidence
        run: |
          set -euo pipefail
          env_log="$BITRIVER_RELEASE_VALIDATION_DIR/environment-validation.log"
          digest_log="$BITRIVER_RELEASE_VALIDATION_DIR/image-digest-validation.log"

          set +e
          ./deploy/check-env.sh "$BITRIVER_RELEASE_ENV_FILE" >"$env_log" 2>&1
          env_status=$?
          ./scripts/require-image-digests.sh --env-file "$BITRIVER_RELEASE_ENV_FILE" >"$digest_log" 2>&1
          digest_status=$?
          set -e

          scan_status=0
          ./scripts/scan-release-evidence.sh \
            --root "$BITRIVER_RELEASE_VALIDATION_DIR" \
            --sentinel-file "$BITRIVER_RELEASE_SENTINEL_FILE" || scan_status=$?

          env_result="failed"
          digest_result="failed"
          [[ $env_status -eq 0 ]] && env_result="passed"
          [[ $digest_status -eq 0 ]] && digest_result="passed"

          cat >"$BITRIVER_RELEASE_EVIDENCE_DIR/release-contract-evidence.json" <<EOF
          {
            "schemaVersion": 1,
            "releaseTag": "$GITHUB_REF_NAME",
            "commit": "$GITHUB_SHA",
            "environmentValidation": "$env_result",
            "imageDigestValidation": "$digest_result",
            "credentialFlow": "job-local-ephemeral",
            "retainedValues": "none"
          }
          EOF

          ./scripts/scan-release-evidence.sh \
            --root "$BITRIVER_RELEASE_EVIDENCE_DIR" \
            --sentinel-file "$BITRIVER_RELEASE_SENTINEL_FILE" || scan_status=$?

          if [[ $scan_status -ne 0 ]]; then
            rm -rf "$BITRIVER_RELEASE_EVIDENCE_DIR"
            echo "Release validation output failed the secret-safety scan; unsafe details were suppressed." >&2
            exit 1
          fi
          if [[ $env_status -ne 0 || $digest_status -ne 0 ]]; then
            cat "$env_log" >&2
            cat "$digest_log" >&2
            exit 1
          fi

      - name: Remove job-local production inputs
        if: always()
        run: |
          for file in "${BITRIVER_RELEASE_ENV_FILE:-}" "${BITRIVER_RELEASE_SENTINEL_FILE:-}"; do
            [[ -n "$file" ]] && rm -f "$file"
          done
          [[ -n "${BITRIVER_RELEASE_VALIDATION_DIR:-}" ]] && rm -rf "$BITRIVER_RELEASE_VALIDATION_DIR"

      - name: Upload redacted contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-contract-evidence
          path: ${{ env.BITRIVER_RELEASE_EVIDENCE_DIR }}
          if-no-files-found: ignore
          retention-days: 3

  go-tests:
    name: Go unit tests
    needs:
      - verify-env
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: off
      GOSUMDB: off
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache: true

      - name: Verify placeholder OME config freshness
        run: |
          set -euo pipefail
          rendered="$RUNNER_TEMP/Server.generated.xml"
          go run ./cmd/bitriver ome render \
            --env-file deploy/.env.example \
            --output "$rendered" \
            --force \
            --quiet
          if ! cmp -s deploy/ome/Server.generated.xml "$rendered"; then
            echo "deploy/ome/Server.generated.xml is stale for deploy/.env.example; render and commit it before releasing." >&2
            exit 1
          fi

      - name: Run verification gate
        run: ./scripts/verify.sh

  postgres-tests:
    name: Postgres storage tests
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: off
      GOSUMDB: off
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bitriver
          POSTGRES_PASSWORD: bitriver
          POSTGRES_DB: bitriver_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd="pg_isready -U bitriver -d bitriver_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache: true


      - name: Wait for Postgres service
        run: |
          container_id="$(docker ps --filter "name=postgres" --format "{{.ID}}" | head -n1)"
          if [ -z "$container_id" ]; then
            echo "postgres service container not found" >&2
            docker ps
            exit 1
          fi

          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            echo "waiting for postgres service to become healthy (attempt $attempt)..." >&2
            sleep 2
          done

          echo "postgres service failed to become healthy" >&2
          docker logs "$container_id"
          exit 1

      - name: Run postgres-tagged storage tests
        env:
          # GitHub Actions service containers are accessed from the host runner via published ports.
          BITRIVER_TEST_POSTGRES_DSN: postgres://bitriver:bitriver@127.0.0.1:54329/bitriver_test?sslmode=disable
        run: ./scripts/test-postgres.sh

  build:
    name: Build release artifacts
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      PRODUCTION_MODFILE: ${{ github.workspace }}/go.production.mod
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache: true

      - name: Prepare upstream production module graph
        run: |
          go run ./cmd/tools/production-module --output "$PRODUCTION_MODFILE"
          go mod download -modfile="$PRODUCTION_MODFILE" all

      - name: Verify pgx mode for postgres artifacts
        env:
          GOFLAGS: -modfile=${{ github.workspace }}/go.production.mod
        run: ./scripts/check-postgres-pgx.sh postgres

      - name: Build binaries
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          targets=(
            "server"
            "transcoder"
            "tools/bootstrap-admin"
            "tools/migrate-json-to-postgres"
          )

          out_dir="dist/${GOOS}-${GOARCH}"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"

          bin_ext=""
          if [ "$GOOS" = "windows" ]; then
            bin_ext=".exe"
          fi

          deploy_dir="$out_dir/deploy"
          mkdir -p "$deploy_dir"
          cp -a deploy/migrations "$deploy_dir/migrations"
          cp deploy/docker-compose.yml "$deploy_dir/docker-compose.yml"
          cp deploy/.env.example "$deploy_dir/.env.example"
          cp deploy/check-env.sh "$deploy_dir/check-env.sh"
          cp -a deploy/install "$deploy_dir/install"
          cp -a deploy/srs "$deploy_dir/srs"
          cp -a deploy/ome "$deploy_dir/ome"
          cp -a deploy/systemd "$deploy_dir/systemd"
          cp -a deploy/nginx "$deploy_dir/nginx"

          declare -A bin_names=(
            ["server"]="bitriver-live"
          )

          declare -A build_tags=(
            ["server"]="postgres"
            ["tools/bootstrap-admin"]="postgres"
            ["tools/migrate-json-to-postgres"]="postgres"
          )

          for target in "${targets[@]}"; do
            bin_name="$(basename "$target")"
            if [[ -n ${bin_names[$target]+x} ]]; then
              bin_name="${bin_names[$target]}"
            fi

            output_path="$out_dir/$bin_name$bin_ext"
            tags="${build_tags[$target]-}"
            if [[ -n "$tags" ]]; then
              go build -modfile="$PRODUCTION_MODFILE" -tags "$tags" -o "$output_path" "./cmd/$target"
              go run ./cmd/tools/verify-production-binary \
                --require-module github.com/jackc/pgx/v5 \
                "$output_path"
            else
              go build -modfile="$PRODUCTION_MODFILE" -o "$output_path" "./cmd/$target"
              go run ./cmd/tools/verify-production-binary "$output_path"
            fi
          done

          if [[ "$GOOS" == "linux" && "$GOARCH" == "amd64" ]]; then
            smoke_log="$out_dir/postgres-smoke.log"
            set +e
            BITRIVER_LIVE_STORAGE_DRIVER=postgres \
              "$out_dir/bitriver-live" \
              -storage-driver postgres \
              -postgres-dsn 'postgres://bitriver:bitriver@127.0.0.1:1/bitriver?sslmode=disable' \
              >"$smoke_log" 2>&1
            smoke_status=$?
            set -e

            if grep -qi 'pgx driver stubbed in this build' "$smoke_log"; then
              echo "bitriver-live postgres smoke check detected a stubbed pgx build" >&2
              cat "$smoke_log" >&2
              exit 1
            fi
            if [[ $smoke_status -eq 0 ]]; then
              echo "bitriver-live postgres smoke check unexpectedly succeeded; expected connection failure against localhost:1" >&2
              cat "$smoke_log" >&2
              exit 1
            fi
          fi

          archive_base="bitriver-live-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            (cd "$out_dir" && zip -r "../${archive_base}.zip" .)
          else
            tar -C "$out_dir" --owner=0 --group=0 --numeric-owner -czf "dist/${archive_base}.tar.gz" .
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/bitriver-live-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error
          retention-days: 7

  build-bitriver:
    name: Build bitriver CLI binaries
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      PRODUCTION_MODFILE: ${{ github.workspace }}/go.production.mod
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache: true

      - name: Prepare upstream production module graph
        run: |
          go run ./cmd/tools/production-module --output "$PRODUCTION_MODFILE"
          go mod download -modfile="$PRODUCTION_MODFILE" all

      - name: Build bitriver binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          build_date="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          out_dir="dist/bitriver-${GOOS}-${GOARCH}"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"

          bin_ext=""
          archive_ext="tar.gz"
          if [ "$GOOS" = "windows" ]; then
            bin_ext=".exe"
            archive_ext="zip"
          fi

          ldflags=(
            "-X" "main.version=${RELEASE_TAG}"
            "-X" "main.commit=${COMMIT_SHA}"
            "-X" "main.date=${build_date}"
          )

          go build -modfile="$PRODUCTION_MODFILE" -trimpath -ldflags "${ldflags[*]}" -o "$out_dir/bitriver${bin_ext}" ./cmd/bitriver
          go run ./cmd/tools/verify-production-binary "$out_dir/bitriver${bin_ext}"

          if [ "$archive_ext" = "zip" ]; then
            (cd dist && zip -r "bitriver-${GOOS}-${GOARCH}.zip" "bitriver-${GOOS}-${GOARCH}")
          else
            tar -C dist -czf "dist/bitriver-${GOOS}-${GOARCH}.tar.gz" "bitriver-${GOOS}-${GOARCH}"
          fi

      - name: Upload bitriver binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitriver-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/bitriver-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error
          retention-days: 7

  build-launcher:
    name: Build launcher bundles and signatures
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      COSIGN_EXPERIMENTAL: "true"
      PRODUCTION_MODFILE: ${{ github.workspace }}/go.production.mod
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache: true

      - name: Prepare upstream production module graph
        run: |
          go run ./cmd/tools/production-module --output "$PRODUCTION_MODFILE"
          go mod download -modfile="$PRODUCTION_MODFILE" all

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build launcher bundle
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          build_date="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          launcher_root="dist/bitriver-launcher-${GOOS}-${GOARCH}"
          rm -rf "$launcher_root"
          mkdir -p "$launcher_root/bin" "$launcher_root/share/deploy"

          bin_ext=""
          archive_ext="tar.gz"
          if [ "$GOOS" = "windows" ]; then
            bin_ext=".exe"
            archive_ext="zip"
          fi

          ldflags=(
            "-X" "main.version=${RELEASE_TAG}"
            "-X" "main.commit=${COMMIT_SHA}"
            "-X" "main.date=${build_date}"
          )

          go build -modfile="$PRODUCTION_MODFILE" -trimpath -ldflags "${ldflags[*]}" -o "$launcher_root/bin/bitriver${bin_ext}" ./cmd/bitriver
          go run ./cmd/tools/verify-production-binary "$launcher_root/bin/bitriver${bin_ext}"
          cp deploy/docker-compose.yml "$launcher_root/share/deploy/docker-compose.yml"
          cp deploy/.env.example "$launcher_root/share/deploy/.env.example"

          if [ "$GOOS" = "windows" ]; then
            cp scripts/bitriver-live-wrapper.ps1 "$launcher_root/bin/bitriver-live.ps1"
            chmod +x "$launcher_root/bin/bitriver${bin_ext}"
          else
            cp scripts/bitriver-live-wrapper.sh "$launcher_root/bin/bitriver-live"
            chmod +x "$launcher_root/bin/bitriver-live" "$launcher_root/bin/bitriver${bin_ext}"
          fi

          cosign sign-blob --yes --output-signature "$launcher_root/bin/bitriver${bin_ext}.sig" "$launcher_root/bin/bitriver${bin_ext}"

          if [ "$archive_ext" = "zip" ]; then
            (cd dist && zip -r "bitriver-launcher-${GOOS}-${GOARCH}.zip" "bitriver-launcher-${GOOS}-${GOARCH}")
          else
            tar -C dist -czf "dist/bitriver-launcher-${GOOS}-${GOARCH}.tar.gz" "bitriver-launcher-${GOOS}-${GOARCH}"
          fi

          if [ "$GOOS" = "linux" ]; then
            export PATH="$HOME/go/bin:$PATH"
            go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.37.1
            NFPM_ARCH="$GOARCH" NFPM_VERSION="$RELEASE_TAG" LAUNCHER_ROOT="$launcher_root" \
              nfpm pkg --packager deb --config deploy/installers/nfpm.yaml --target "dist/bitriver-live_${RELEASE_TAG}_${GOARCH}.deb"
            NFPM_ARCH="$GOARCH" NFPM_VERSION="$RELEASE_TAG" LAUNCHER_ROOT="$launcher_root" \
              nfpm pkg --packager rpm --config deploy/installers/nfpm.yaml --target "dist/bitriver-live_${RELEASE_TAG}_${GOARCH}.rpm"
          fi

      - name: Upload launcher archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/bitriver-launcher-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux installer packages
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launcher-linux-packages
          path: |
            dist/bitriver-live_${{ github.ref_name }}_${{ matrix.goarch }}.deb
            dist/bitriver-live_${{ github.ref_name }}_${{ matrix.goarch }}.rpm
          if-no-files-found: error
          retention-days: 7

  build-viewer:
    name: Build viewer bundle
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/viewer
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/viewer/package-lock.json

      - name: Install dependencies
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm ci

      - name: Audit production and build dependencies
        run: npm audit --audit-level=high

      - name: Lint
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run lint

      - name: Install Playwright browsers
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npx playwright install --with-deps

      - name: Test
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run test:integration

      - name: Cache Next.js build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/viewer/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('web/viewer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Build viewer
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Package viewer bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle_root="dist/bitriver-viewer"
          rm -rf "$bundle_root"
          mkdir -p "$bundle_root"
          cp -R .next "$bundle_root/.next"
          rm -rf "$bundle_root/.next/cache"
          cp -R public "$bundle_root/public"
          cp package.json package-lock.json next.config.js "$bundle_root/"
          tar -C dist -czf "dist/bitriver-viewer-${RELEASE_TAG}.tar.gz" bitriver-viewer
          rm -rf "$bundle_root"

      - name: Upload viewer bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viewer-bundle
          path: dist/bitriver-viewer-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-images:
    name: Publish container images
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: api
            context: .
            dockerfile: Dockerfile
            image_name: bitriver-live
          - component: srs-controller
            context: .
            dockerfile: cmd/srs-controller/Dockerfile
            image_name: bitriver-srs-controller
          - component: transcoder
            context: .
            dockerfile: cmd/transcoder/Dockerfile
            image_name: bitriver-transcoder
          - component: viewer
            context: web/viewer
            dockerfile: web/viewer/Dockerfile
            image_name: bitriver-viewer
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/bitriver-live
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}:latest

      - name: Generate SBOM for ${{ matrix.component }} image
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
          output-file: ${{ matrix.image_name }}-${{ env.RELEASE_TAG }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom-${{ matrix.component }}
          path: ${{ matrix.image_name }}-${{ env.RELEASE_TAG }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  brew-formula:
    name: Generate Homebrew formula
    needs:
      - build-launcher
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download macOS launcher artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: launcher-darwin-*
          path: dist
          merge-multiple: true

      - name: Generate formula
        env:
          VERSION: ${{ github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          set -euo pipefail
          arm_tar="dist/bitriver-launcher-darwin-arm64.tar.gz"
          amd_tar="dist/bitriver-launcher-darwin-amd64.tar.gz"
          arm_sha="$(sha256sum "$arm_tar" | awk '{print $1}')"
          amd_sha="$(sha256sum "$amd_tar" | awk '{print $1}')"
          arm_url="$REPO_URL/$(basename "$arm_tar")"
          amd_url="$REPO_URL/$(basename "$amd_tar")"
          mkdir -p dist/formula
          scripts/generate-brew-formula.sh "$VERSION" "$arm_url" "$arm_sha" "$amd_url" "$amd_sha" dist/formula/bitriver-live.rb

      - name: Upload formula artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: dist/formula/bitriver-live.rb
          if-no-files-found: error
          retention-days: 7

  windows-msi:
    name: Build Windows MSI installer
    needs:
      - go-tests
      - postgres-tests
      - verify-env
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      PRODUCTION_MODFILE: ${{ github.workspace }}\go.production.mod
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: '.go-version'
          cache: true

      - name: Prepare upstream production module graph
        shell: pwsh
        run: |
          go run ./cmd/tools/production-module --output $env:PRODUCTION_MODFILE
          go mod download -modfile=$env:PRODUCTION_MODFILE all

      - name: Build MSI
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $buildDate = (Get-Date).ToUniversalTime().ToString("s") + "Z"
          $launcherRoot = Join-Path $env:RUNNER_TEMP "bitriver-launcher-windows-amd64"
          if (Test-Path $launcherRoot) { Remove-Item -Recurse -Force $launcherRoot }
          New-Item -ItemType Directory -Path (Join-Path $launcherRoot "bin") | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $launcherRoot "share\deploy") | Out-Null

          $ldflags = "-X main.version=$env:RELEASE_TAG -X main.commit=$env:COMMIT_SHA -X main.date=$buildDate"
          $binaryPath = Join-Path $launcherRoot "bin/bitriver.exe"
          go build -modfile=$env:PRODUCTION_MODFILE -trimpath -ldflags $ldflags -o $binaryPath ./cmd/bitriver
          go run ./cmd/tools/verify-production-binary $binaryPath
          Copy-Item scripts/bitriver-live-wrapper.ps1 (Join-Path $launcherRoot "bin/bitriver-live.ps1")
          Copy-Item deploy/docker-compose.yml (Join-Path $launcherRoot "share/deploy/docker-compose.yml")
          Copy-Item deploy/.env.example (Join-Path $launcherRoot "share/deploy/.env.example")

          $distDir = Join-Path (Get-Location) "dist"
          if (-not (Test-Path $distDir)) { New-Item -ItemType Directory -Path $distDir | Out-Null }
          $candle = "C:\\Program Files (x86)\\WiX Toolset v3.11\\bin\\candle.exe"
          $light = "C:\\Program Files (x86)\\WiX Toolset v3.11\\bin\\light.exe"
          & $candle -dProductVersion=$env:RELEASE_TAG -dSourceDir=$launcherRoot deploy/installers/bitriver-live.wxs
          & $light -ext WixUIExtension bitriver-live.wixobj -o (Join-Path $distDir "bitriver-live-$($env:RELEASE_TAG).msi")

      - name: Upload MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: dist/bitriver-live-${{ github.ref_name }}.msi
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs:
      - go-tests
      - postgres-tests
      - verify-env
      - build
      - build-bitriver
      - build-launcher
      - build-viewer
      - publish-images
      - brew-formula
      - windows-msi
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find release -type f -name '*.tar.gz' -exec cp {} dist/ \;
          find release -type f -name '*.zip' -exec cp {} dist/ \;
          find release -type f -name '*.spdx.json' -exec cp {} dist/ \;
          find release -type f -name '*.deb' -exec cp {} dist/ \;
          find release -type f -name '*.rpm' -exec cp {} dist/ \;
          find release -type f -name '*.msi' -exec cp {} dist/ \;
          find release -type f -name '*.rb' -exec cp {} dist/ \;

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > CHECKSUMS.txt

      - name: Scan and inventory release payload
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/release-publication-evidence"
          rm -rf "$evidence_dir"
          mkdir -p "$evidence_dir"

          ./scripts/scan-release-evidence.sh \
            --root release \
            --inventory "$evidence_dir/artifact-inventory.tsv"
          ./scripts/scan-release-evidence.sh --root dist

          cat >"$evidence_dir/release-scan-status.json" <<EOF
          {
            "schemaVersion": 1,
            "releaseTag": "$GITHUB_REF_NAME",
            "commit": "$GITHUB_SHA",
            "downloadedArtifactScan": "passed",
            "publicationPayloadScan": "passed"
          }
          EOF
          ./scripts/scan-release-evidence.sh --root "$evidence_dir"
          echo "BITRIVER_RELEASE_PUBLICATION_EVIDENCE=$evidence_dir" >>"$GITHUB_ENV"

      - name: Upload release publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication-evidence
          path: ${{ env.BITRIVER_RELEASE_PUBLICATION_EVIDENCE }}
          if-no-files-found: error
          retention-days: 3

      - name: Generate release notes
        id: notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const result = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
            });
            core.setOutput('body', result.data.body);

      - name: Publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/CHECKSUMS.txt
            dist/*.spdx.json
            dist/*.deb
            dist/*.rpm
            dist/*.msi
            dist/*.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
