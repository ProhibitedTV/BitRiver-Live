name: Temporary viewer compatibility validation

on:
  push:
    branches:
      - feat/1307-viewer-compatibility-matrix
    paths:
      - .github/workflows/validate-1307-viewer-compat.yml
      - web/viewer/**
      - docs/viewer-compatibility.md
      - scripts/viewer_compatibility_test.go

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Check compatibility contract
        run: go test ./scripts -run TestViewerCompatibilityMatrixContract -count=1

      - name: Set up viewer Node toolchain
        uses: ./.github/actions/setup-node-viewer

      - name: Install all Playwright engines
        working-directory: web/viewer
        run: npx playwright install --with-deps
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Lint viewer
        working-directory: web/viewer
        run: npm run lint
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run viewer unit tests
        working-directory: web/viewer
        run: npm test
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build standalone viewer
        working-directory: web/viewer
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run complete Playwright matrix
        working-directory: web/viewer
        run: npx playwright test
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Remove temporary validation workflow
        if: ${{ success() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-1307-viewer-compat.yml
          git commit -m "chore: remove temporary viewer compatibility validation"
          git push
