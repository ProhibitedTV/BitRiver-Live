name: Ingest end-to-end

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - internal/ingest/**
      - deploy/srs/**
      - deploy/ome/**
      - cmd/srs-controller/**
      - cmd/transcoder/**
      - scripts/test-ingest-e2e.sh
      - scripts/render-srs-config.sh
      - scripts/render-ome-config.sh
  push:
    branches:
      - main
    paths:
      - internal/ingest/**
      - deploy/srs/**
      - deploy/ome/**
      - cmd/srs-controller/**
      - cmd/transcoder/**
      - scripts/test-ingest-e2e.sh
      - scripts/render-srs-config.sh
      - scripts/render-ome-config.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest-e2e:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: off
      GOSUMDB: off
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run ingest pipeline integration test
        run: ./scripts/test-ingest-e2e.sh
