name: Ingest end-to-end

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - '**/*.go'
      - scripts/**
      - internal/**
      - .github/workflows/ingest-e2e.yml
  pull_request:
    paths:
      - '**/*.go'
      - scripts/**
      - internal/**
      - .github/workflows/ingest-e2e.yml

permissions:
  contents: read

jobs:
  ingest-e2e:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: off
      GOSUMDB: off
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run ingest pipeline integration test
        run: ./scripts/test-ingest-e2e.sh
