name: Ingest end-to-end

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - internal/ingest/**
      - cmd/srs-controller/**
      - cmd/transcoder/**
      - deploy/srs/**
      - deploy/ome/**
      - scripts/test-ingest-e2e.sh
      - scripts/render-srs-config.sh
      - scripts/render-ome-config.sh
      - .github/workflows/ingest-e2e.yml
  push:
    branches:
      - main
    paths:
      - internal/ingest/**
      - cmd/srs-controller/**
      - cmd/transcoder/**
      - deploy/srs/**
      - deploy/ome/**
      - scripts/test-ingest-e2e.sh
      - scripts/render-srs-config.sh
      - scripts/render-ome-config.sh
      - .github/workflows/ingest-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest-e2e:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOPROXY: off
      GOSUMDB: off
    steps:
      - name: Set up Go toolchain
        uses: ./.github/actions/setup-go

      - name: Run ingest pipeline integration test
        run: ./scripts/test-ingest-e2e.sh
