name: Temporary js-yaml lock refresh

on:
  push:
    branches:
      - dependabot/npm_and_yarn/web/viewer/viewer-tooling-6bad96eced

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up viewer dependencies
        uses: ./.github/actions/setup-node-viewer

      - name: Refresh js-yaml security patches
        working-directory: web/viewer
        run: |
          set -euo pipefail
          npm update js-yaml --package-lock-only --ignore-scripts
          node - <<'NODE'
          const lock = require('./package-lock.json')
          const entries = Object.entries(lock.packages)
            .filter(([path]) => /(^|\/)js-yaml$/.test(path))
            .map(([path, pkg]) => [path, pkg.version])
          console.log('js-yaml lock entries:', entries)
          NODE
          npm audit --audit-level=high

      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          git add web/viewer/package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile change produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): refresh js-yaml security patches'
          git push origin "HEAD:${GITHUB_REF_NAME}"
