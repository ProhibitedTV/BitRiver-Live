name: Go unit tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - vendor/**
      - scripts/**
      - deploy/**
      - .github/workflows/go-unit-tests.yml
  pull_request:
    # If you want tests for every PR, delete the paths: filter here.
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - vendor/**
      - scripts/**
      - deploy/**
      - .github/workflows/go-unit-tests.yml

permissions:
  contents: read

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GOTOOLCHAIN: local
      GOPROXY: off
      GOSUMDB: off
      GOFLAGS: -mod=vendor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Keeps CI in sync with go.mod
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests
        run: go test ./...

      - name: Build bitriver binary
        run: go build ./cmd/bitriver
