name: Go unit tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GOTOOLCHAIN: local
      GOPROXY: off
      GOSUMDB: off
      GOVULNCHECK_VERSION: v1.1.3

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-go
        with:
          checkout-fetch-depth: '0'

      - name: Run verification gate
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./scripts/verify.sh

      # ci-contract: allow-duplicate Cross-platform coverage on non-Linux runners.
      - name: Run unit tests (non-Linux)
        if: matrix.os != 'ubuntu-latest'
        run: go test ./... -count=1 -timeout=120s

      - name: Install govulncheck
        env:
          # Intentional exception: govulncheck is fetched from the public module proxy.
          GOFLAGS: ''
          GOPROXY: https://proxy.golang.org,direct
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Verify Helm deploy assets are synced from canonical sources
        shell: bash
        run: ./scripts/check-helm-deploy-assets-drift.sh

      - name: Check Go function comment coverage
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi
          ./scripts/check-function-comments.py --strict-unexported --git-base "$BASE_REF"

      - name: Build bitriver binary
        run: go build ./cmd/bitriver

      - name: Run govulncheck (Go 1.21 policy)
        shell: bash
        run: ./scripts/run-govulncheck.sh

      - name: Upload govulncheck artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: govulncheck-${{ matrix.os }}
          path: .artifacts/govulncheck/
          if-no-files-found: warn
