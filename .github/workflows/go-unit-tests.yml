name: Go unit tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - vendor/**
      - scripts/**
      - deploy/**
      - .github/workflows/go-unit-tests.yml
  pull_request:
    # If you want tests for every PR, delete the paths: filter here.
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - vendor/**
      - scripts/**
      - deploy/**
      - .github/workflows/go-unit-tests.yml

permissions:
  contents: read

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          # Keeps CI in sync with go.mod
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure vendored modules are available
        shell: bash
        run: |
          test -d vendor
          test -f vendor/modules.txt

      - name: Smoke test OME renderer
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/render_ome_config_test.py

      - name: Run unit tests
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: off
          GOSUMDB: off
          GOFLAGS: -mod=vendor
        # Increase timeout to reduce flakes
        run: go test ./... -count=1 -timeout=120s

      - name: Build bitriver binary
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOPROXY: off
          GOSUMDB: off
          GOFLAGS: -mod=vendor
        run: go build ./cmd/bitriver
