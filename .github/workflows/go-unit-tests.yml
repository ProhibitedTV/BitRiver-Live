name: Go unit tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - third_party/**
      - scripts/**
      - deploy/**
      - .github/workflows/go-unit-tests.yml
  pull_request:
    # If you want tests for every PR, delete the paths: filter here.
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - third_party/**
      - scripts/**
      - deploy/**
      - .github/workflows/go-unit-tests.yml

permissions:
  contents: read

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GOTOOLCHAIN: local
      GOPROXY: off
      GOSUMDB: off
      GOVULNCHECK_VERSION: v1.1.3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Keeps CI in sync with go.mod
          go-version-file: 'go.mod'
          cache: true

      - name: Install govulncheck
        env:
          GOFLAGS: ''
          GOPROXY: https://proxy.golang.org,direct
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Run unit tests
        run: go test ./... -count=1 -timeout=120s

      - name: Verify dependency source of truth
        shell: bash
        run: ./scripts/check-dependency-source.sh

      - name: Verify Helm deploy assets are synced from canonical sources
        shell: bash
        run: ./scripts/check-helm-deploy-assets-drift.sh

      - name: Check Go function comment coverage
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi
          ./scripts/check-function-comments.py --strict-unexported --git-base "$BASE_REF"

      - name: Build bitriver binary
        run: go build ./cmd/bitriver

      - name: Run govulncheck (Go 1.21 policy)
        shell: bash
        run: ./scripts/run-govulncheck.sh

      - name: Upload govulncheck artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-${{ matrix.os }}
          path: .artifacts/govulncheck/
          if-no-files-found: warn
