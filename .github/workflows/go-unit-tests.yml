name: Go unit tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GOTOOLCHAIN: local
      GOPROXY: off
      GOSUMDB: off
      GOVULNCHECK_VERSION: v1.1.3

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          # Keeps CI in sync with go.mod
          go-version-file: 'go.mod'
          cache: true

      - name: Install govulncheck
        env:
          # Intentional exception: govulncheck is fetched from the public module proxy.
          GOFLAGS: ''
          GOPROXY: https://proxy.golang.org,direct
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: Ensure go.sum is non-empty
        shell: bash
        run: ./scripts/check-go-sum-not-empty.sh

      - name: Run verification gate
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./scripts/verify.sh

      - name: Run unit tests (non-Linux)
        if: matrix.os != 'ubuntu-latest'
        run: go test ./... -count=1 -timeout=120s

      - name: Verify Helm deploy assets are synced from canonical sources
        shell: bash
        run: ./scripts/check-helm-deploy-assets-drift.sh

      - name: Check Go function comment coverage
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD~1"
          fi
          ./scripts/check-function-comments.py --strict-unexported --git-base "$BASE_REF"

      - name: Build bitriver binary
        run: go build ./cmd/bitriver

      - name: Run govulncheck (Go 1.21 policy)
        shell: bash
        run: ./scripts/run-govulncheck.sh

      - name: Upload govulncheck artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: govulncheck-${{ matrix.os }}
          path: .artifacts/govulncheck/
          if-no-files-found: warn
