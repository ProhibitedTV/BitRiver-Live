name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-viewer-update:
    if: github.event.pull_request.head.ref == 'fix/viewer-pending-updates-2026-08-07'
    runs-on: ubuntu-latest
    steps:
      - name: Check out dependency-update branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/viewer-pending-updates-2026-08-07
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/viewer/package-lock.json

      - name: Advance viewer baselines and regenerate lockfile
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/runtime_baseline_test.go')
          text = path.read_text()
          replacements = {
              '`"next": "16.2.11"`': '`"next": "16.2.12"`',
              '`"react": "19.2.7"`': '`"react": "19.2.8"`',
              '`"react-dom": "19.2.7"`': '`"react-dom": "19.2.8"`',
              '`"@types/node": "24.13.3"`': '`"@types/node": "26.1.2"`',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected baseline: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cd web/viewer
          npm install --package-lock-only --ignore-scripts
          npm ci
          node - <<'NODE'
          const pkg = require('./package.json')
          const expected = {
            next: ['dependencies', '16.2.12'],
            ovenplayer: ['dependencies', '0.10.53'],
            react: ['dependencies', '19.2.8'],
            'react-dom': ['dependencies', '19.2.8'],
            '@playwright/test': ['devDependencies', '1.62.1'],
            '@testing-library/user-event': ['devDependencies', '14.6.3'],
            '@types/node': ['devDependencies', '26.1.2'],
            'eslint-config-next': ['devDependencies', '16.3.0'],
            'brace-expansion': ['devDependencies', '5.0.9'],
          }
          for (const [name, [section, version]] of Object.entries(expected)) {
            if (pkg[section][name] !== version) throw new Error(`${name}=${pkg[section][name]}, want ${version}`)
          }
          NODE
          npm audit --audit-level=high

      - name: Restore normal CI and commit generated files
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml web/viewer/package-lock.json scripts/runtime_baseline_test.go
          if git diff --cached --quiet; then
            echo 'No generated dependency changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'deps(viewer): regenerate lockfile and advance baselines'
          git push origin HEAD:fix/viewer-pending-updates-2026-08-07
