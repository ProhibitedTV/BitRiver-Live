name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-js-yaml-lock:
    if: github.event.pull_request.head.ref == 'fix/js-yaml-audit-2026-08-07'
    runs-on: ubuntu-latest
    steps:
      - name: Check out security-fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/js-yaml-audit-2026-08-07
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/viewer/package-lock.json

      - name: Refresh patched js-yaml lock entries
        working-directory: web/viewer
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          npm update js-yaml --package-lock-only --ignore-scripts
          node - <<'NODE'
          const lock = require('./package-lock.json')
          const versions = Object.entries(lock.packages)
            .filter(([path]) => /(^|\/)js-yaml$/.test(path))
            .map(([path, pkg]) => `${path || '<root>'}: ${pkg.version}`)
          console.log(versions.join('\n'))
          if (!versions.some(v => v.endsWith(': 3.15.1')) || !versions.some(v => v.endsWith(': 4.3.1'))) {
            throw new Error('expected patched js-yaml 3.15.1 and 4.3.1 lock entries')
          }
          NODE
          npm audit --audit-level=high

      - name: Restore normal CI and commit generated lockfile
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml web/viewer/package-lock.json
          if git diff --cached --quiet; then
            echo 'No security lockfile change produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): refresh js-yaml security patches'
          git push origin HEAD:fix/js-yaml-audit-2026-08-07
