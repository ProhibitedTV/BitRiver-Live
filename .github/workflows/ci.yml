name: CI

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-guard:
    name: Committed secret file guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject committed secret artifacts
        shell: bash
        run: ./scripts/check-no-committed-secrets.sh

  changed-files:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      verify_changed: ${{ steps.filter.outputs.verify_changed }}
      go_changed: ${{ steps.filter.outputs.go_changed }}
      deploy_changed: ${{ steps.filter.outputs.deploy_changed }}
      viewer_changed: ${{ steps.filter.outputs.viewer_changed }}
      monitoring_changed: ${{ steps.filter.outputs.monitoring_changed }}
      docs_changed: ${{ steps.filter.outputs.docs_changed }}
      ingest_changed: ${{ steps.filter.outputs.ingest_changed }}
      shell_changed: ${{ steps.filter.outputs.shell_changed }}
      postgres_changed: ${{ steps.filter.outputs.postgres_changed }}
      image_scan_changed: ${{ steps.filter.outputs.image_scan_changed }}
      quickstart_changed: ${{ steps.filter.outputs.quickstart_changed }}
      wizard_release_changed: ${{ steps.filter.outputs.wizard_release_changed }}
      go_workflow_changed: ${{ steps.filter.outputs.go_workflow_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute path filters
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Pull-request API results stop after 3,000 files. An empty token makes
          # the pinned action use the complete checkout and git diff instead.
          token: ''
          filters: |
            verify_changed:
              - '.github/actions/**'
              - '.github/workflows/**'
              - 'go.mod'
              - 'go.sum'
              - '**/*.go'
              - 'internal/**'
              - 'cmd/**'
              - 'scripts/**'
              - 'deploy/**'
              - 'third_party/**'
              - 'web/viewer/**'
            go_changed:
              # Go runtime + module/dependency inputs (exclude docs-only changes).
              - '.go-version'
              - '.github/actions/setup-go/action.yml'
              - 'go.mod'
              - 'go.sum'
              - '**/*.go'
              - 'third_party/**'
            deploy_changed:
              # Any deploy contract or deployment artifact edit.
              - 'deploy/**'
            viewer_changed:
              # Viewer app + immediate viewer/runtime contract dependencies.
              - '.github/actions/setup-node-viewer/action.yml'
              - '.github/workflows/viewer-ci.yml'
              - 'web/viewer/**'
              - 'deploy/.env.example'
              - 'internal/api/**'
              - 'internal/server/**'
            monitoring_changed:
              - '.github/workflows/monitoring-config.yml'
              - 'deploy/monitoring/**'
              - 'deploy/docker-compose.monitoring.yml'
              - 'scripts/check-monitoring-config.sh'
              - 'scripts/render-alertmanager-config.sh'
            docs_changed:
              - '.github/workflows/docs-consistency.yml'
              - 'README.md'
              - 'docs/**'
              - 'deploy/.env.example'
            ingest_changed:
              # Ingest pipeline only (controllers, renderers, and ingest config).
              - 'internal/ingest/**'
              - 'cmd/transcoder/**'
              - 'cmd/srs-controller/**'
              - 'scripts/test-ingest-e2e.sh'
              - 'scripts/test-ingest-storage.sh'
              - 'scripts/test-production-golden-path.sh'
              - 'scripts/production_golden_path.py'
              - 'scripts/golden-path-client.Dockerfile'
              - 'scripts/render-srs-config.sh'
              - 'scripts/render-ome-config.sh'
              - 'deploy/srs/**'
              - 'deploy/ome/**'
            shell_changed:
              # Shell scripts only.
              - '.github/workflows/shellcheck.yml'
              - 'scripts/**/*.sh'
              - 'deploy/install/**/*.sh'
            postgres_changed:
              - 'internal/storage/**'
              - 'deploy/migrations/**'
              - 'scripts/test-postgres.sh'
              - 'go.mod'
              - 'go.sum'
              - 'third_party/**'
            image_scan_changed:
              - '.github/workflows/image-scan.yml'
              - '.github/workflows/release.yml'
              - '.trivyignore/**'
              - 'deploy/docker-compose.yml'
              - 'deploy/**/Dockerfile*'
              - 'cmd/**'
              - 'internal/**'
              - 'web/viewer/**'
            quickstart_changed:
              - '.github/actions/setup-go/action.yml'
              - '.github/workflows/quickstart-smoke.yml'
              - 'cmd/bitriver/**'
              - 'deploy/**'
              - 'scripts/**'
            wizard_release_changed:
              - '.github/workflows/wizard-release.yml'
              - 'deploy/install/wizard.sh'
              - 'scripts/test-wizard-release.sh'
            go_workflow_changed:
              - '.github/actions/setup-go/action.yml'
              - '.github/workflows/go-unit-tests.yml'
              - '.github/workflows/postgres-tests.yml'
              - '.github/workflows/ingest-e2e.yml'
              - '.github/workflows/release.yml'
              - 'scripts/check-go-workflow-config.sh'
              - '.github/workflows/go-workflow-consistency.yml'

  verify:
    name: Ubuntu test-all gate
    needs: changed-files
    if: needs.changed-files.outputs.verify_changed == 'true'
    runs-on: ubuntu-latest
    env:
      BITRIVER_TEST_POSTGRES: ${{ needs.changed-files.outputs.postgres_changed == 'true' && '1' || '0' }}
      BITRIVER_TEST_QUICKSTART: ${{ needs.changed-files.outputs.quickstart_changed == 'true' && '1' || '0' }}
      BITRIVER_TEST_ALL_PRODUCTION_GOLDEN_PATH: ${{ needs.changed-files.outputs.ingest_changed == 'true' && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-go

      - name: Check CI workflow contract
        shell: bash
        run: ./scripts/check-ci-contract.sh

      - name: Run unified ubuntu test gate
        shell: bash
        run: ./scripts/test-all.sh

  go-verify:
    name: Go tests (${{ matrix.os }})
    needs:
      - changed-files
      - verify
    if: always() && (needs.changed-files.outputs.go_changed == 'true' || needs.changed-files.outputs.deploy_changed == 'true') && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-go

      # ci-contract: allow-duplicate Cross-platform coverage on macOS/Windows complements ubuntu verify.sh.
      - name: Run unit tests
        run: go test ./... -count=1 -timeout=120s

  quickstart-smoke:
    needs:
      - changed-files
      - verify
    if: always() && needs.changed-files.outputs.quickstart_changed == 'true' && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    uses: ./.github/workflows/quickstart-smoke.yml
    with:
      run_compose_smoke: false

  viewer-ci:
    needs:
      - changed-files
      - verify
    if: always() && needs.changed-files.outputs.viewer_changed == 'true' && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    uses: ./.github/workflows/viewer-ci.yml

  shellcheck:
    needs: changed-files
    if: needs.changed-files.outputs.shell_changed == 'true'
    uses: ./.github/workflows/shellcheck.yml

  docs-consistency:
    needs: changed-files
    if: needs.changed-files.outputs.docs_changed == 'true'
    uses: ./.github/workflows/docs-consistency.yml

  monitoring-config:
    needs: changed-files
    if: needs.changed-files.outputs.monitoring_changed == 'true'
    uses: ./.github/workflows/monitoring-config.yml

  go-workflow-consistency:
    needs: changed-files
    if: needs.changed-files.outputs.go_workflow_changed == 'true'
    uses: ./.github/workflows/go-workflow-consistency.yml

  wizard-release:
    needs: changed-files
    if: needs.changed-files.outputs.wizard_release_changed == 'true'
    uses: ./.github/workflows/wizard-release.yml

  image-scan:
    needs: changed-files
    if: needs.changed-files.outputs.image_scan_changed == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/image-scan.yml

  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - secret-guard
      - changed-files
      - verify
      - go-verify
      - quickstart-smoke
      - viewer-ci
      - shellcheck
      - docs-consistency
      - monitoring-config
      - go-workflow-consistency
      - wizard-release
      - image-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate PR release scorecard
        id: scorecard
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" >"$RUNNER_TEMP/changed-files.txt"
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" >"$RUNNER_TEMP/pr-body.md"
          ./scripts/check-pr-release-scorecard.sh \
            --body "$RUNNER_TEMP/pr-body.md" \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --strict-if-risky | tee "$RUNNER_TEMP/pr-release-scorecard.txt"

      - name: Evaluate required CI results
        id: aggregate
        shell: bash
        env:
          SECRET_GUARD_RESULT: ${{ needs.secret-guard.result }}
          CHANGED_FILES_RESULT: ${{ needs.changed-files.result }}
          VERIFY_CHANGED: ${{ needs.changed-files.outputs.verify_changed }}
          GO_CHANGED: ${{ needs.changed-files.outputs.go_changed }}
          DEPLOY_CHANGED: ${{ needs.changed-files.outputs.deploy_changed }}
          VIEWER_CHANGED: ${{ needs.changed-files.outputs.viewer_changed }}
          MONITORING_CHANGED: ${{ needs.changed-files.outputs.monitoring_changed }}
          DOCS_CHANGED: ${{ needs.changed-files.outputs.docs_changed }}
          SHELL_CHANGED: ${{ needs.changed-files.outputs.shell_changed }}
          IMAGE_SCAN_CHANGED: ${{ needs.changed-files.outputs.image_scan_changed }}
          QUICKSTART_CHANGED: ${{ needs.changed-files.outputs.quickstart_changed }}
          WIZARD_RELEASE_CHANGED: ${{ needs.changed-files.outputs.wizard_release_changed }}
          GO_WORKFLOW_CHANGED: ${{ needs.changed-files.outputs.go_workflow_changed }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          GO_VERIFY_RESULT: ${{ needs.go-verify.result }}
          QUICKSTART_RESULT: ${{ needs.quickstart-smoke.result }}
          VIEWER_RESULT: ${{ needs.viewer-ci.result }}
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
          DOCS_RESULT: ${{ needs.docs-consistency.result }}
          MONITORING_RESULT: ${{ needs.monitoring-config.result }}
          GO_WORKFLOW_RESULT: ${{ needs.go-workflow-consistency.result }}
          WIZARD_RESULT: ${{ needs.wizard-release.result }}
          IMAGE_SCAN_RESULT: ${{ needs.image-scan.result }}
          SCORECARD_REQUIRED: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          SCORECARD_RESULT: ${{ steps.scorecard.outcome }}
          MERGE_GATE_REPORT: ${{ runner.temp }}/merge-gate-summary.md
        run: ./scripts/check-ci-merge-gate.sh

      - name: Upload merge gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/merge-gate-summary.md
            ${{ runner.temp }}/pr-release-scorecard.txt
          if-no-files-found: error
          retention-days: 14
