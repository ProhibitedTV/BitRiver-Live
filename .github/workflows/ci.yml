name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate-eslint-10-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up viewer Node toolchain
        uses: ./.github/actions/setup-node-viewer

      - name: Generate and verify ESLint 10 migration
        shell: bash
        run: |
          set -euo pipefail
          cd web/viewer
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint@10.8.0 @eslint/compat@2.1.0
          npm ci
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=high
          cd ../..
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/runtime_baseline_test.go')
          text = path.read_text()
          old = '`"eslint": "9.39.5"`'
          new = '`"eslint": "10.8.0"`'
          if old not in text:
              raise SystemExit('expected ESLint baseline not found')
          path.write_text(text.replace(old, new, 1))
          PY
          go test ./scripts -count=1

      - name: Restore normal CI and commit migration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml web/viewer/package.json web/viewer/package-lock.json web/viewer/eslint.config.mjs scripts/runtime_baseline_test.go
          git commit -m "deps(viewer): migrate to ESLint 10.8.0"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
