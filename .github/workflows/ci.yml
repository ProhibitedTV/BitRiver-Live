name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate-eslint-10-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up viewer Node toolchain
        uses: ./.github/actions/setup-node-viewer

      - name: Diagnose ESLint 10 parser compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd web/viewer
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint@10.8.0 @eslint/compat@2.1.0
          npm ci
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { ESLint } from 'eslint';
          const eslint = new ESLint();
          for (const file of ['__tests__/authDialog.test.tsx', 'eslint.config.mjs']) {
            const config = await eslint.calculateConfigForFile(file);
            const parser = config.languageOptions?.parser;
            console.log(`PARSER ${file}:`, parser?.meta ?? '<no meta>');
            if (parser?.parseForESLint) {
              const source = fs.readFileSync(file, 'utf8');
              const parsed = parser.parseForESLint(source, {
                ...(config.languageOptions?.parserOptions ?? {}),
                filePath: file,
                loc: true,
                range: true,
                tokens: true,
                comment: true,
              });
              console.log(`SCOPE ${file}: addGlobals=${typeof parsed?.scopeManager?.addGlobals}`);
            }
          }
          NODE
          npm run lint

      - name: Restore normal CI and commit migration
        if: false
        shell: bash
        run: echo diagnostic-only
