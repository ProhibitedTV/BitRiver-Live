name: Quickstart compose smoke

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      run_compose_smoke:
        description: Run the full Ubuntu Compose quickstart smoke job.
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      run_compose_smoke:
        description: Run the full Ubuntu Compose quickstart smoke job.
        required: false
        type: boolean
        default: true

jobs:
  quickstart-entrypoints:
    name: Quickstart entrypoint sanity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-go

      - name: Validate quickstart.sh help and static checks
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/quickstart.sh
          ./scripts/quickstart.sh --help
          if ./scripts/quickstart.sh --definitely-not-a-real-flag; then
            echo "Expected unknown-flag invocation to fail" >&2
            exit 1
          fi

      - name: Run shellcheck for quickstart.sh
        if: runner.os != 'Windows'
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: scripts
          check_together: 'yes'
          ignore_names: |
            *.md

      - name: Validate quickstart.ps1 help output
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File scripts/quickstart.ps1 -help

      - name: Validate quickstart.ps1 no-op entrypoint path
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File scripts/quickstart.ps1 -ValidateOnly

      - name: Static validation for quickstart.ps1 helper usage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scriptText = Get-Content -Path scripts/quickstart.ps1 -Raw
          $requiredSnippets = @(
            'Ensure-Go',
            'Invoke-Cli',
            '$goPath = (Get-Command go -ErrorAction Stop).Source',
            '$buildOutput = @(& $goPath @buildArgs 2>&1)',
            '$cliOutput = @(& $tempBinary @CliArgs 2>&1)',
            'bitriver-live-go-build-cache',
            'SetEnvironmentVariable(''GOCACHE'', $goCacheRoot, ''Process'')',
            'if ($ValidateOnly)',
            'Invoke-Cli -CliArgs @(''quickstart'', ''--help'') -AllowHelpExitCode',
            '@(''quickstart'') + $QuickstartArgs'
          )

          foreach ($snippet in $requiredSnippets) {
            if (-not $scriptText.Contains($snippet)) {
              Write-Error "Missing expected quickstart.ps1 snippet: $snippet"
            }
          }

  quickstart-smoke:
    if: inputs.run_compose_smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go toolchain
        uses: ./.github/actions/setup-go

      - name: Verify quickstart defaults match CI seed
        run: python3 scripts/test-quickstart-env.py

      - name: Validate quickstart compose config
        run: ./scripts/test-quickstart.sh
