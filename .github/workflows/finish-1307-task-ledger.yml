name: Refresh viewer compatibility task ledger

on:
  push:
    branches:
      - feat/1307-viewer-compatibility-matrix

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh scoped task status
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/update-tasks.py
          python /tmp/update-tasks.py

      - name: Remove temporary workflow and commit ledger
        shell: bash
        run: |
          git config user.name "RhythmicCarnage"
          git config user.email "71204385+ProhibitedTV@users.noreply.github.com"
          git rm .github/workflows/finish-1307-task-ledger.yml
          git add TASKS.md
          git commit -m "docs: record viewer compatibility qualification"
          git push
