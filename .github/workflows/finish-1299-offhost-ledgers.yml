name: Finish off-host planning ledgers

on:
  push:
    branches:
      - chore/1299-scheduled-offhost-backup-proof
    paths:
      - scripts/.offhost-tasks-section.txt

permissions:
  contents: write

jobs:
  update-ledgers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/1299-scheduled-offhost-backup-proof
          fetch-depth: 0

      - name: Update PLAN and TASKS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          specs = [
              (Path("PLAN.md"), Path("scripts/.offhost-plan-section.txt"), "# PLAN", "## Current scope - scheduled off-host backup freshness qualification (#1299)"),
              (Path("TASKS.md"), Path("scripts/.offhost-tasks-section.txt"), "# TASKS", "## Scoped change: scheduled off-host backup freshness qualification (#1299)"),
          ]

          for target, addition, title, marker in specs:
              text = target.read_text(encoding="utf-8")
              if marker in text:
                  continue
              if not text.startswith(title + "\n"):
                  raise SystemExit(f"unexpected header in {target}")
              section = addition.read_text(encoding="utf-8").rstrip()
              remainder = text[len(title) + 1:].lstrip("\n")
              target.write_text(title + "\n\n" + section + "\n\n" + remainder, encoding="utf-8")
          PY

      - name: Commit ledgers and remove helper files
        shell: bash
        run: |
          rm -f \
            .github/workflows/finish-1299-offhost-ledgers.yml \
            scripts/.offhost-plan-section.txt \
            scripts/.offhost-tasks-section.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A PLAN.md TASKS.md .github/workflows/finish-1299-offhost-ledgers.yml scripts/.offhost-plan-section.txt scripts/.offhost-tasks-section.txt
          git diff --cached --check
          git commit -m "docs: record off-host backup qualification plan"
          git push origin HEAD:chore/1299-scheduled-offhost-backup-proof
