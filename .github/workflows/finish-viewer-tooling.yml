name: Finish viewer tooling update

on:
  push:
    branches:
      - dependabot/npm_and_yarn/web/viewer/viewer-tooling-f5ceac8175

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tooling branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/npm_and_yarn/web/viewer/viewer-tooling-f5ceac8175
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/viewer/package-lock.json

      - name: Validate viewer tooling through normal install path
        shell: bash
        run: |
          set -euo pipefail
          cd web/viewer
          rm -rf node_modules
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test -- --runInBand
          npm run build

      - name: Align checked viewer tooling invariant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/runtime_baseline_test.go')
          text = path.read_text()
          replacements = {
              '`"@testing-library/user-event": "14.6.6"`': '`"@testing-library/user-event": "14.6.7"`',
              '`"@types/node": "26.4.0"`': '`"@types/node": "26.5.1"`',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected invariant: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify runtime baseline test
        shell: bash
        run: |
          set -euo pipefail
          go test ./scripts -run TestViewerRuntimeBaselineIsAligned -count=1

      - name: Commit reviewed invariant alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RhythmicCarnage'
          git config user.email '71204385+ProhibitedTV@users.noreply.github.com'
          git rm .github/workflows/finish-viewer-tooling.yml
          git add scripts/runtime_baseline_test.go
          git commit -m 'deps(viewer): align tooling runtime invariant'
          git push origin HEAD:dependabot/npm_and_yarn/web/viewer/viewer-tooling-f5ceac8175
