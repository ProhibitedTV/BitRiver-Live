name: Go workflow consistency

on:
  push:
    paths:
      - '.github/workflows/go-unit-tests.yml'
      - '.github/workflows/postgres-tests.yml'
      - '.github/workflows/ingest-e2e.yml'
      - '.github/workflows/release.yml'
      - 'scripts/check-go-workflow-config.sh'
      - '.github/workflows/go-workflow-consistency.yml'
  pull_request:
    paths:
      - '.github/workflows/go-unit-tests.yml'
      - '.github/workflows/postgres-tests.yml'
      - '.github/workflows/ingest-e2e.yml'
      - '.github/workflows/release.yml'
      - 'scripts/check-go-workflow-config.sh'
      - '.github/workflows/go-workflow-consistency.yml'

jobs:
  verify-go-workflow-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Go workflow setup conventions
        run: ./scripts/check-go-workflow-config.sh
