name: Go workflow consistency

on:
  workflow_call:
  workflow_dispatch:

jobs:
  verify-go-workflow-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Go workflow setup conventions
        run: ./scripts/check-go-workflow-config.sh
