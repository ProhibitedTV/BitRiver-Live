name: Setup Go

description: Install the repository Go toolchain with module cache enabled.
inputs:
  go-version-file:
    description: Path to the file containing the exact CI Go version.
    required: false
    default: .go-version
  cache:
    description: Enable Go build/module caching.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: ${{ inputs.cache }}
