name: Setup Go

description: Checkout repository and install Go from go.mod with module cache enabled.
inputs:
  checkout-fetch-depth:
    description: Fetch depth passed to actions/checkout.
    required: false
    default: '1'
  go-version-file:
    description: Path to the go.mod file for selecting Go version.
    required: false
    default: go.mod
  cache:
    description: Enable Go build/module caching.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Check out repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: ${{ inputs.checkout-fetch-depth }}

    - name: Set up Go
      uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: ${{ inputs.cache }}
