name: Setup Node for Viewer

description: Install Node, restore the npm cache, and install viewer dependencies.
inputs:
  node-version:
    description: Node.js version passed to actions/setup-node.
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: web/viewer/package-lock.json

    - name: Install viewer dependencies
      shell: bash
      working-directory: web/viewer
      env:
        NEXT_TELEMETRY_DISABLED: '1'
      run: npm ci
